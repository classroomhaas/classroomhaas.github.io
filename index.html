  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #181818;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* Background Particle Canvas */
    #tsparticles {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* --- GLASSY PASSWORD SCREEN --- */
    #passwordScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(18, 18, 18, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.5s ease-out;
    }

    .glass-card {
      background: rgba(40, 40, 40, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 40px 45px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 380px;
      width: 90%;
    }

    #passwordScreen h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      margin-bottom: 24px;
      color: #00aaff;
      text-shadow: 0 0 8px #00aaff, 0 0 16px rgba(0, 170, 255, 0.6);
    }

    #passwordScreen input {
      width: 100%;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-size: 1rem;
      background: rgba(20, 20, 20, 0.6);
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
      text-align: center;
    }

    #passwordScreen input:focus {
      border-color: #00aaff;
      box-shadow: 0 0 12px rgba(0, 170, 255, 0.4);
      background: rgba(10, 10, 10, 0.8);
    }

    #passwordScreen button {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      background: #00aaff;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 170, 255, 0.4);
      transition: all 0.3s ease;
    }

    #passwordScreen button:hover {
      background: #0088cc;
      box-shadow: 0 0 20px rgba(0, 170, 255, 0.8);
      transform: translateY(-2px);
    }

    #passwordScreen #error {
      color: #ff4d4d;
      margin-top: 14px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    /* --- GLASS MAIN CONTENT --- */
    #realContent {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(35, 35, 35, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 45px 50px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    #title {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 3.5rem;
      color: #00aaff;
      text-shadow: 0 0 10px #00aaff, 0 0 20px rgba(0, 170, 255, 0.6);
      margin-bottom: 1.5rem;
      letter-spacing: -0.5px;
    }

    #button-container {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    button#bypass-button {
      background: #00aaff;
      border: none;
      border-radius: 12px;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 180px;
      box-shadow: 0 0 15px rgba(0, 170, 255, 0.3);
    }

    button#bypass-button:hover {
      background: #0088cc;
      box-shadow: 0 0 20px rgba(0, 170, 255, 0.8);
      transform: translateY(-2px);
    }

    .no-fix-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .no-fix-box a {
      font-size: 0.95rem;
      color: #ccc;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .no-fix-box a:hover {
      color: #00aaff;
      text-decoration: underline;
    }

    .no-fix-box div {
      font-size: 0.75rem;
      color: #888;
      margin-top: 2px;
    }

    #random-text {
      margin-top: 25px;
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
      max-width: 400px;
      line-height: 1.4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

<body>

<div id="tsparticles"></div>

<!-- Glassy Password Screen -->
<div id="passwordScreen">
  <div class="glass-card">
    <h2>Enter Password</h2>
    <input type="password" id="passwordInput" placeholder="Password" />
    <button onclick="checkPassword()">Enter</button>
    <p id="error">Incorrect password</p>
  </div>
</div>

<!-- Main Glass Content -->
<div id="realContent" style="display:none;">
  <div id="title">Fix Selector</div>

  <div id="button-container">
    <button id="bypass-button">Fix</button>
    <div class="no-fix-box">
      <a href="site">No Fix</a>
      <div>less features</div>
    </div>
  </div>

  <div id="random-text"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
<script>
  tsParticles.load("tsparticles", {
    fullScreen: { enable: false },
    fpsLimit: 60,
    particles: {
      color: { value: "#4da6ff" },
      links: {
        color: "#4da6ff",
        distance: 120,
        enable: true,
        opacity: 0.2,
        width: 1
      },
      collisions: { enable: false },
      move: {
        directions: "none",
        enable: true,
        outModes: { default: "bounce" },
        random: false,
        speed: 1,
        straight: false
      },
      number: { density: { enable: true, area: 800 }, value: 40 },
      opacity: { value: 0.3 },
      shape: { type: "circle" },
      size: { value: { min: 1, max: 4 } }
    },
    detectRetina: true
  });
</script>

<script>

    #go-home-btn.expanded {
      width: auto;
      border-radius: 8px;
      padding: 0 14px;
      font-weight: 600;
    }
    #go-home-btn span {
      margin-left: 8px;
      font-size: 1rem;
      display: none;
    }
    #go-home-btn.expanded span {
      display: inline;
    }
  \`;
  document.head.appendChild(style);

  const iframe = document.createElement('iframe');
  iframe.src = 'site';
  document.body.appendChild(iframe);

  const goHomeBtn = document.createElement('button');
  goHomeBtn.id = 'go-home-btn';
  goHomeBtn.innerHTML = '🏠<span>Go Home</span>';

  goHomeBtn.addEventListener('mouseenter', () => {
    goHomeBtn.classList.add('expanded');
  });
  goHomeBtn.addEventListener('mouseleave', () => {
    goHomeBtn.classList.remove('expanded');
  });
  goHomeBtn.addEventListener('click', () => {
    iframe.src = iframe.src;
  });

  document.body.appendChild(goHomeBtn);
`;

    const script = newTab.document.createElement('script');
    script.textContent = code;
    newTab.document.body.innerHTML = '';
    newTab.document.body.appendChild(script);
  });

  document.getElementById("passwordInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkPassword();
  });

    const chosen = randomTexts[Math.floor(Math.random() * randomTexts.length)];
    document.getElementById("random-text").textContent = chosen;
  }

    const input = document.getElementById("passwordInput").value;
    if (input === "lebronjames") {

  const goHomeBtn = document.createElement('button');
  goHomeBtn.id = 'go-home-btn';
  goHomeBtn.innerHTML = '🏠<span>Go Home</span>';

  goHomeBtn.addEventListener('click', () => {

      const script = newTab.document.createElement('script');
      script.textContent = code;
      newTab.document.body.innerHTML = '';

    } else {
      document.getElementById("error").style.display = "block";

</script>

</body>
