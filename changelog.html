<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Changelog</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #2b2b2b;
    color: #e0e0e0;
    position: relative;
    padding-bottom: 3rem;
  }

  header {
    background-color: #3a3a3a;
    padding: 1.2rem 2rem;
    text-align: center;
    position: relative;
    z-index: 10;
  }

  header h1 {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    background: linear-gradient(90deg, #4da6ff, #1e90ff, #4da6ff);
    background-size: 200% 200%;
    animation: gradientShift 3s ease infinite;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 8px rgba(77, 166, 255, 0.6);
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  main {
    max-width: 800px;
    margin: 2rem auto;
    padding: 0 1rem;
    z-index: 10;
    position: relative;
  }

  .changelog-entry {
    background: #3a3a3a;
    border-left: 4px solid #4da6ff;
    border-radius: 8px;
    margin-bottom: 1rem;
    padding: 1rem 1.2rem;
    box-shadow: 0 0 8px rgba(77,166,255,0.2);
    transition: all 0.2s ease;
  }

  .changelog-entry:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 12px rgba(77,166,255,0.4);
  }

  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }

  .entry-header h2 {
    font-size: 1.2rem;
    color: #4da6ff;
  }

  .entry-header span {
    color: #aaa;
    font-size: 0.9rem;
  }

  .entry-content {
    display: none;
    margin-top: 0.8rem;
    line-height: 1.5;
    color: #ddd;
  }

  .show-more {
    background: none;
    border: 1px solid #4da6ff;
    border-radius: 6px;
    color: #4da6ff;
    padding: 0.3rem 0.8rem;
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: 0.2s ease;
  }

  .show-more:hover {
    background: #4da6ff;
    color: white;
  }

  footer {
    text-align: center;
    padding: 1.5rem;
    color: #ccc;
    font-size: 0.9rem;
  }

  #tsparticles {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="tsparticles"></div>

<header>
  <h1>Changelog</h1>
</header>

<main>
  <div class="changelog-entry">
    <div class="entry-header">
      <h2>Version 2.1.0</h2>
      <span>October 28, 2025</span>
    </div>
    <div class="entry-content">
      <p>Insert text here</p>
    </div>
    <button class="show-more">Show More</button>
  </div>

  <div class="changelog-entry">
    <div class="entry-header">
      <h2>Version 2.0.0</h2>
      <span>October 21, 2025</span>
    </div>
    <div class="entry-content">
      <p>Insert text here</p>
    </div>
    <button class="show-more">Show More</button>
  </div>

  <div class="changelog-entry">
    <div class="entry-header">
      <h2>Version 1.9.0</h2>
      <span>October 10, 2025</span>
    </div>
    <div class="entry-content">
      <p>Insert text here</p>
    </div>
    <button class="show-more">Show More</button>
  </div>
</main>

<footer>
  <a href="index.html" style="color:#4da6ff; text-decoration:underline;">Back to Home</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
<script>
  // Particle background
  tsParticles.load("tsparticles", {
    fullScreen: { enable: false },
    fpsLimit: 60,
    particles: {
      color: { value: "#4da6ff" },
      links: { color: "#4da6ff", distance: 120, enable: true, opacity: 0.2, width: 1 },
      move: { enable: true, speed: 1 },
      number: { value: 40 },
      opacity: { value: 0.3 },
      shape: { type: "circle" },
      size: { value: { min: 1, max: 4 } }
    },
  });

  // Toggle "Show More"
  document.querySelectorAll('.show-more').forEach(button => {
    button.addEventListener('click', () => {
      const content = button.previousElementSibling;
      const isVisible = content.style.display === 'block';
      content.style.display = isVisible ? 'none' : 'block';
      button.textContent = isVisible ? 'Show More' : 'Show Less';
    });
  });
</script>
</body>
</html>
