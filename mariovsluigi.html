<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play Mario Vs Luigi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #1e1e1e;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    iframe {
      border: none;
      width: 90vw;
      height: 90vh;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 170, 255, 0.4);
    }

    a.back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #00aaff;
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      z-index: 100;
    }

    a.back-btn:hover {
      background: #0088cc;
      box-shadow: 0 0 12px #00aaff;
    }
  </style>
</head>
<body>

  <a href="../site.html" class="back-btn">← Back</a>

  <!-- This loads ONLY the game itself, not the Itch.io website -->
  <iframe src="https://itch.io/embed-upload/11474825?color=333333" allowfullscreen></iframe>

</body>
</html>
