<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPRAY ROULETTE</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0b0b;--wall:#15121d;--pink:#ff2e93;--lime:#b6ff00;--cyan:#00e5ff;--gold:#ffc400;--vio:#9b5cff;--paper:#fff7e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--wall);color:var(--paper);font-family:'Permanent Marker',Impact,'Arial Black',sans-serif;overflow-x:hidden;
background-image:linear-gradient(rgba(0,0,0,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.3) 2px,transparent 2px),radial-gradient(circle at 20% 10%,rgba(255,46,147,.22),transparent 45%),radial-gradient(circle at 85% 90%,rgba(0,229,255,.2),transparent 45%);
background-size:64px 32px,128px 64px,auto,auto}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:14px 14px 24px;display:flex;flex-direction:column;gap:12px;position:relative}
.tag{position:fixed;inset:auto -20px 8% -20px;font-size:90px;color:rgba(255,255,255,.04);transform:rotate(-8deg);white-space:nowrap;pointer-events:none;z-index:0}
h1{font-family:'Rubik Mono One',Impact,sans-serif;font-size:clamp(34px,11vw,60px);line-height:.95;margin:10px 0 0;text-align:center;transform:rotate(-3deg);
color:var(--lime);-webkit-text-stroke:3px var(--ink);text-shadow:5px 5px 0 var(--pink),9px 9px 0 var(--ink)}
h1 span{color:var(--cyan);display:block;font-size:.8em;text-shadow:5px 5px 0 var(--vio),9px 9px 0 var(--ink)}
h2{font-family:'Rubik Mono One',Impact,sans-serif;margin:4px 0;color:var(--gold);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--pink);transform:rotate(-1deg)}
.sub{text-align:center;font-size:18px;color:var(--gold);transform:rotate(1.5deg)}
.b{font-family:'Rubik Mono One',Impact,sans-serif;font-size:clamp(16px,5vw,22px);padding:16px 14px;border:4px solid var(--ink);background:var(--c,var(--lime));color:var(--ink);
box-shadow:6px 6px 0 var(--ink);transform:rotate(var(--r,-1.2deg));cursor:pointer;text-transform:uppercase;transition:transform .08s,box-shadow .08s;width:100%}
.b:nth-of-type(even){--r:1.2deg}
.b:active{transform:translate(4px,4px) rotate(0);box-shadow:2px 2px 0 var(--ink)}
.b:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.b.sm{width:auto;font-size:14px;padding:8px 12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.panel{background:rgba(0,0,0,.55);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--pink);padding:12px;transform:rotate(.5deg)}
.coin{align-self:flex-end;background:var(--gold);color:var(--ink);padding:4px 12px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:'Rubik Mono One',sans-serif;font-size:14px;transform:rotate(2deg)}
.top{display:flex;justify-content:space-between;align-items:center}
.card{flex:1;background:rgba(0,0,0,.6);border:4px solid var(--c);box-shadow:5px 5px 0 var(--ink);padding:8px 10px;position:relative}
.card b{font-family:'Rubik Mono One',sans-serif;font-size:13px;color:var(--c)}
.hp{font-size:26px;letter-spacing:2px}.sm{font-size:14px;min-height:18px}
.tn{position:absolute;right:-6px;top:-12px;background:var(--lime);color:var(--ink);font-style:normal;font-size:12px;padding:1px 8px;border:3px solid var(--ink);transform:rotate(6deg);animation:wob .5s infinite alternate}
@keyframes wob{to{transform:rotate(-4deg) scale(1.1)}}
.log{text-align:center;font-size:20px;min-height:52px;padding:8px;background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--cyan);transform:rotate(-1deg)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{background:var(--vio);color:#fff;border:3px solid var(--ink);padding:3px 10px;font-size:15px;box-shadow:3px 3px 0 var(--ink)}
.items{display:flex;gap:8px;flex-wrap:wrap;min-height:64px}
.it{font-family:'Permanent Marker',sans-serif;font-size:22px;background:var(--cyan);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:6px 8px;cursor:pointer;flex:1;min-width:64px;color:var(--ink);transform:rotate(-2deg)}
.it small{display:block;font-size:11px}.it:disabled{opacity:.45}
.cyl{width:min(64vw,250px);margin:0 auto;display:block;filter:drop-shadow(6px 6px 0 #000)}
.cyl g.rot{transition:transform .6s cubic-bezier(.5,1.6,.5,1);transform-origin:100px 100px}
.splat{position:fixed;inset:0;z-index:20;pointer-events:none;animation:sp .95s forwards;display:flex;align-items:center;justify-content:center}
.splat i{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,var(--c) 0 16%,transparent 17%),radial-gradient(circle at 70% 30%,var(--c) 0 12%,transparent 13%),radial-gradient(circle at 55% 70%,var(--c) 0 22%,transparent 23%),radial-gradient(circle at 20% 80%,var(--c) 0 10%,transparent 11%),radial-gradient(circle at 85% 75%,var(--c) 0 13%,transparent 14%)}
.splat em{font-family:'Rubik Mono One',sans-serif;font-style:normal;font-size:clamp(40px,16vw,92px);color:#fff;-webkit-text-stroke:3px #000;text-shadow:6px 6px 0 #000;transform:rotate(-8deg);position:relative}
@keyframes sp{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.05)}70%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translate(-6px,4px)}75%{transform:translate(6px,-4px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.emo{position:fixed;z-index:25;font-family:'Rubik Mono One',sans-serif;font-size:56px;-webkit-text-stroke:2px #000;pointer-events:none;animation:fl 1.8s forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-120px) scale(1.4)}}
.sw{width:54px;height:54px;border-radius:50%;border:4px solid var(--ink);background:var(--c);margin:0 auto 6px;box-shadow:3px 3px 0 var(--ink)}
.shopc{text-align:center;font-size:16px}
.big{font-family:'Rubik Mono One',sans-serif;font-size:clamp(34px,13vw,64px);text-align:center;color:var(--lime);-webkit-text-stroke:2px var(--ink);text-shadow:5px 5px 0 var(--pink);letter-spacing:6px;margin:6px 0}
input{font-family:'Rubik Mono One',sans-serif;font-size:24px;text-align:center;text-transform:uppercase;width:100%;padding:12px;border:4px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) rotate(-2deg);background:var(--pink);color:#fff;padding:10px 18px;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);z-index:30;font-size:18px;max-width:90vw;text-align:center}
ul{margin:6px 0;padding-left:20px;font-size:17px;line-height:1.4}
.card.aim{cursor:pointer;box-shadow:0 0 0 4px #fff,0 0 24px var(--c);animation:aimp .5s infinite alternate}.card.aim:hover{filter:brightness(1.3)}@keyframes aimp{to{transform:scale(1.06)}}
.b,.it,.chip,.card b,.coin{white-space:nowrap}
.b:not(:disabled):hover{transform:translate(-3px,-4px) rotate(0) scale(1.05);box-shadow:10px 10px 0 var(--ink);filter:brightness(1.12)}
.b:not(:disabled):active{transform:translate(4px,4px) rotate(0);box-shadow:2px 2px 0 var(--ink)}
.it{position:relative;transition:transform .2s cubic-bezier(.2,.9,.3,1.3),box-shadow .2s ease,filter .2s ease}
.it:not(:disabled):hover{transform:translateY(-5px) rotate(2deg) scale(1.1);box-shadow:6px 8px 0 var(--ink);filter:brightness(1.1)}
.it[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);width:max-content;max-width:150px;white-space:normal;background:var(--paper);color:var(--ink);font-size:13px;line-height:1.2;padding:6px 8px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);z-index:15;pointer-events:none;text-align:center;font-family:'Permanent Marker',sans-serif}
.it[data-tip]:last-child:hover::after{left:auto;right:0;transform:none}
.it[data-tip]:first-child:hover::after{left:0;right:auto;transform:none}
.nin{font-size:18px}
.ok{position:fixed;left:50%;top:38%;z-index:25;pointer-events:none;width:90vw;text-align:center;animation:okp .9s forwards}
.ok em{font-style:normal;font-family:'Rubik Mono One',sans-serif;font-size:clamp(24px,8vw,48px);color:#fff;-webkit-text-stroke:2px #000;text-shadow:0 4px 0 #000,0 0 18px rgba(255,255,255,.7)}
@keyframes okp{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.2)}35%{opacity:1;transform:translate(-50%,-14px) scale(1)}100%{opacity:0;transform:translate(-50%,-110px) scale(1)}}li{margin:5px 0}
</style></head>
<body><div class="tag">SPRAY OR PRAY</div><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const COL=[['Hot Pink','#ff2e93',0],['Toxic Lime','#b6ff00',0],['Cyan Drip','#00e5ff',100],['Gold Rush','#ffc400',150],['Violet Riot','#9b5cff',200],['Blood Orange','#ff6a00',300],['Ghost White','#f4f4ff',350],['Magma Red','#ff2a2a',450]];
const CYL=[['Steel','#2a2433',0],['Gold','#7a5c00',200],['Toxic','#0e4d1c',250],['Chrome','#8a93a8',300]];
const IT={peek:['👁️','PEEK'],spin:['🌀','SPIN'],shield:['🛡️','SHIELD'],dbl:['💥','DOUBLE'],heal:['💚','HEAL'],steal:['🏃','STEAL'],cuff:['⛓️','CUFF'],flip:['🔁','FLIP']};
const KEYS=Object.keys(IT),rnd=n=>Math.floor(Math.random()*n);
let SV={};try{SV=JSON.parse(localStorage.getItem('rr_sv'))||{}}catch(e){}
SV=Object.assign({coins:100,owned:[0,1],sel:0,perk:false,w:0,l:0,snd:true,cyo:[0],cy:0,x2:false,bo:1},SV);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm16=(n,d)=>String(n||'').replace(/\s+/g,' ').trim().slice(0,16)||d;
const TIP={peek:'See if the next chamber is live',spin:'Reshuffle the cylinder',shield:'Blocks the next hit on you',dbl:'Your next hit does 2 damage',heal:'Restore 1 life',steal:'Take a random item from an opponent',cuff:'The next player skips their turn',flip:'Flip the next chamber live/blank'};
function fitText(){document.querySelectorAll('.b,.it,.chip,.card b,.coin,input').forEach(e=>{e.style.fontSize='';let f=parseFloat(getComputedStyle(e).fontSize);while(e.scrollWidth>e.clientWidth+1&&f>8){f-=1;e.style.fontSize=f+'px'}})}
const save=()=>{try{localStorage.setItem('rr_sv',JSON.stringify(SV))}catch(e){}};
let scr='menu',S=null,me=0,mode='',R=null,RM=null,code='',gp=null,hp=null,paid=0,lastEv=-1,botT=0,hbT=0,hiT=0;

let aim=0,lob=null,myPeer=null,banned=new Set(),cfgB={bots:1,bo:1},cfgF={bots:0,bo:1},setupF=0;
/* ---------- PeerJS multiplayer shim (same API the game uses) ---------- */
const UID=(()=>{try{let u=localStorage.getItem('rr_uid');if(!u){u=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('rr_uid',u)}return u}catch(e){return Math.random().toString(36).slice(2)}})();
function mkBus(){const H={},PL=[];return{H,PL,
 deliver(t,d,peer,by,same){(H[t]||[]).slice().forEach(f=>{try{f({topic:t,data:d,peer,by,sameTab:same,kind:'viewer',guest:false})}catch(e){}})},
 on(t,f){(H[t]=H[t]||[]).push(f);return()=>{H[t]=(H[t]||[]).filter(x=>x!==f)}},
 onPeers(f){PL.push(f);return()=>{}}}}
const SHIM={
 host(name){return new Promise((res,rej)=>{
  const id='sprayroulette-'+name,pr=new Peer(id),conns={},B=mkBus();let dead=0;
  const R={on:B.on,onPeers:B.onPeers,
   emit(t,d){Promise.resolve().then(()=>B.deliver(t,d,id,null,true));Object.values(conns).forEach(c=>{try{c.send({t,d,f:id})}catch(e){}});return Promise.resolve()},
   leave(){return new Promise(r=>setTimeout(()=>{dead=1;try{pr.destroy()}catch(e){}r()},200))}};
  pr.on('open',()=>res(R));
  pr.on('error',e=>{if(!dead)rej({code:e.type||'error'})});
  pr.on('connection',c=>{const by=(c.metadata&&c.metadata.u)||null;
   c.on('open',()=>{conns[c.peer]=c});
   c.on('data',m=>{if(!m||typeof m.t!=='string'||!['hi','act','left','emo'].includes(m.t))return;
    B.deliver(m.t,m.d,c.peer,by,false);
    if(m.t==='emo'||m.t==='left')Object.entries(conns).forEach(([k,o])=>{if(k!==c.peer)try{o.send({t:m.t,d:m.d,f:c.peer})}catch(e){}})});
   c.on('close',()=>{delete conns[c.peer];B.PL.slice().forEach(f=>f({left:[{peer:c.peer}]}))});
   c.on('error',()=>{})})})},
 join(name){return new Promise((res,rej)=>{
  const hid='sprayroulette-'+name,pr=new Peer(),B=mkBus();let c,fin=0;
  const fail=code=>{if(!fin){fin=1;try{pr.destroy()}catch(e){}rej({code})}};
  const to=setTimeout(()=>fail('timeout'),12000);
  const R={on:B.on,onPeers:B.onPeers,
   emit(t,d){Promise.resolve().then(()=>B.deliver(t,d,pr.id,null,true));try{if(c&&c.open)c.send({t,d})}catch(e){}return Promise.resolve()},
   leave(){return new Promise(r=>setTimeout(()=>{try{c&&c.close()}catch(e){}try{pr.destroy()}catch(e){}r()},200))}};
  pr.on('error',e=>fail(e.type||'error'));
  pr.on('open',()=>{c=pr.connect(hid,{metadata:{u:UID},reliable:true});
   c.on('open',()=>{if(fin)return;fin=1;clearTimeout(to);res(R)});
   c.on('data',m=>{if(m&&typeof m.t==='string')B.deliver(m.t,m.d,m.f,null,false)});
   c.on('close',()=>B.PL.slice().forEach(f=>f({left:[{peer:hid}]})));
   c.on('error',()=>{})})})}};
/* ---------- sound ---------- */
let AC;function snd(f,d,t,v){if(!SV.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||.07;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function toast(t,d){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),d||2600)}

/* ---------- engine ---------- */
const al=s=>s.hp.map((h,i)=>h>0?i:-1).filter(i=>i>=0);
const nxt=(s,p)=>{let i=p;do{i=(i+1)%s.n}while(s.hp[i]<=0);return i};
function load(s){s.cyl=[0,0,0,0,0,0];let n=1+rnd(2);while(n){const i=rnd(6);if(!s.cyl[i]){s.cyl[i]=1;n--}}s.pos=0;s.seen=Array(s.n).fill(null)}
function draw(s){const p=s.turn;if(s.it[p].length<3){const k=KEYS[rnd(KEYS.length)];s.it[p].push(k);s.log+=' '+s.nm[p]+' drew '+IT[k][1]+'.'}}
function pass(s,p){let o=nxt(s,p);while(s.cf[o]){s.cf[o]=0;s.log+=' '+s.nm[o]+' is cuffed, skips!';o=nxt(s,o)}s.turn=o;draw(s)}
function resetSet(s,f){const z=v=>s.hp.map(()=>v);s.hp=z(3);s.it=s.hp.map(()=>[]);s.sh=z(0);s.db=z(0);s.cf=z(0);load(s);s.turn=f;draw(s)}
function newGame(seats,bo){const z=v=>seats.map(()=>v),s={n:seats.length,hp:z(3),it:seats.map(()=>[]),sh:z(0),db:z(0),cf:z(0),rw:z(0),bo,turn:0,log:'Fresh wall. Fresh can. Who tags first?',over:0,col:seats.map(x=>x.c),nm:seats.map(x=>x.n),bot:seats.map(x=>x.bot?1:0),pe:seats.map(x=>x.pe||null),ev:0,fx:null};
 load(s);seats.forEach((x,i)=>{if(x.k)s.it[i].push(KEYS[rnd(KEYS.length)])});draw(s);return s}
function seatsFor(hs,bots){const used=hs.map(x=>x.c),out=hs.slice();for(let j=0;j<bots;j++){let c=rnd(COL.length);while(used.includes(c))c=(c+1)%COL.length;used.push(c);out.push({n:'BOT '+(j+1),c,bot:1})}return out}
function apply(s,p,a){
 if(s.over||s.turn!==p||!a)return;const N=s.nm;
 if(a.k==='item'){const it=s.it[p][a.i];if(!it)return;s.it[p].splice(a.i,1);const o=nxt(s,p),opp=al(s).filter(x=>x!==p);
  if(it==='peek'){s.seen[p]=!!s.cyl[s.pos];s.log=N[p]+' peeked the chamber 👁️'}
  if(it==='spin'){for(let i=5;i>0;i--){const j=rnd(i+1);[s.cyl[i],s.cyl[j]]=[s.cyl[j],s.cyl[i]]}s.pos=0;s.seen=Array(s.n).fill(null);s.log=N[p]+' spun the cylinder 🌀'}
  if(it==='shield'){s.sh[p]=1;s.log=N[p]+' put up a shield 🛡️'}
  if(it==='dbl'){s.db[p]=1;s.log=N[p]+' loaded DOUBLE paint 💥'}
  if(it==='heal'){s.hp[p]=Math.min(3,s.hp[p]+1);s.log=N[p]+' got a life back 💚'}
  if(it==='steal'){const c=opp.filter(x=>s.it[x].length);if(c.length){const v=c[rnd(c.length)],t=s.it[v],x=t.splice(rnd(t.length),1)[0];s.it[p].push(x);s.log=N[p]+' stole '+IT[x][1]+' from '+N[v]+' 🏃'}else s.log=N[p]+' tried to steal… nothing there'}
  if(it==='cuff'){s.cf[o]=1;s.log=N[p]+' cuffed '+N[o]+' ⛓️ (skips next turn)'}
  if(it==='flip'){s.cyl[s.pos]=s.cyl[s.pos]?0:1;const k=s.seen[p]!==null;s.seen=Array(s.n).fill(null);if(k)s.seen[p]=!!s.cyl[s.pos];s.log=N[p]+' flipped the next chamber 🔁';if(!s.cyl.slice(s.pos).some(x=>x)){load(s);s.log+=' No live cans left, so a fresh cylinder was loaded!'}}
  s.ev++;s.fx={t:'item',who:p};return}
 if(a.k==='shoot'){const v=a.t;if(!(s.hp[v]>0))return;const live=s.cyl[s.pos];s.pos++;s.seen=Array(s.n).fill(null);
  if(live){const d=s.db[p]?2:1;s.db[p]=0;
   if(s.sh[v]){s.sh[v]=0;s.log='Shield ate the paint! '+N[v]+' is clean 🛡️';s.fx={t:'block',who:v,by:p}}
   else{s.hp[v]-=d;s.log=N[p]+' splatted '+(v===p?'themselves':N[v])+(d>1?' for DOUBLE!':'!');s.fx={t:'splat',who:v,by:p}}
   s.ev++;
   if(al(s).length<2){const w=al(s)[0];s.rw[w]++;if(s.rw[w]>=Math.ceil(s.bo/2)){s.over=w+1;s.log=N[w]+' wins the wall! 👑';return}resetSet(s,v);s.fx.r=1;s.log=N[w]+' takes the set! '+s.rw.join('-')+'.'+s.log;return}
   load(s);s.log+=' Reloaded.';pass(s,p)}
  else{s.ev++;s.fx={t:'blank',who:p};s.log='Click. Blank.';if(v===p)s.log+=' '+N[p]+' goes again!';else pass(s,p);if(!s.cyl.slice(s.pos).some(x=>x)){load(s);s.log+=' New cylinder!'}}}
}
function botStep(){const s=S;if(!s||s.over||!s.bot[s.turn]||(mode!=='bot'&&mode!=='host'))return;const b=s.turn,it=s.it[b],has=k=>it.indexOf(k),opp=al(s).filter(x=>x!==b);let i;
 const bi=i=>{apply(s,b,{k:'item',i});sync()};
 const lv=s.cyl.slice(s.pos).reduce((a,c)=>a+c,0),left=6-s.pos,p=s.seen[b]===null?lv/left:(s.seen[b]?1:0);
 if(s.hp[b]<3&&(i=has('heal'))>=0)return bi(i);
 if(!s.sh[b]&&(i=has('shield'))>=0)return bi(i);
 if(s.seen[b]===null&&(i=has('peek'))>=0)return bi(i);
 if(opp.some(x=>s.it[x].length)&&(i=has('steal'))>=0)return bi(i);
 if(!s.cf[nxt(s,b)]&&(i=has('cuff'))>=0&&Math.random()<.5)return bi(i);
 if(s.seen[b]===false&&(i=has('flip'))>=0)return bi(i);
 if(p>.5&&!s.db[b]&&(i=has('dbl'))>=0)return bi(i);
 const t=p>.4?opp.reduce((a,x)=>s.hp[x]<s.hp[a]?x:a,opp[rnd(opp.length)]):b;
 apply(s,b,{k:'shoot',t});sync()}

/* ---------- flow ---------- */
function go(a){if(!S||S.over||S.turn!==me)return;snd(300,.08);if(mode==='guest'){R&&R.emit('act',a).catch(()=>{});return}apply(S,me,a);sync()}
function sync(){clearTimeout(botT);if(mode==='host')bc();render();if((mode==='bot'||mode==='host')&&S&&!S.over&&S.bot[S.turn])botT=setTimeout(botStep,1300)}
function bc(){if(R&&S)R.emit('st',S).catch(()=>{})}
function blob(){if(R&&lob)R.emit('lob',{ps:lob.ps.map(x=>({n:x.n,c:x.c})),b:lob.b,bo:lob.bo,m:lob.m||'',code}).catch(()=>{})}
function me1(){return [{n:nm16(SV.name,'YOU'),c:SV.sel,k:SV.perk}]}
function startBot(){mode='bot';me=0;paid=0;lastEv=-1;S=newGame(seatsFor(me1(),cfgB.bots),cfgB.bo);scr='game';sync()}
function startGame(){if(mode!=='host'||!lob)return;const hs=lob.ps.map(x=>({n:x.n,c:x.c,k:x.k,pe:x.peer}));if(hs.length+lob.b<2)return toast('Need at least 2 players');paid=0;lastEv=-1;me=0;S=newGame(seatsFor(hs,lob.b),lob.bo);scr='game';sync()}
function again(){if(mode==='bot')startBot();else if(mode==='host')startGame()}
function menu(){clearTimeout(botT);clearInterval(hbT);clearInterval(hiT);if(R){R.leave().catch(()=>{});R=null}S=null;lob=null;hp=null;myPeer=null;banned=new Set();mode='';scr='menu';render()}
async function quit(){if(R&&(mode==='host'||mode==='guest')){try{await Promise.race([R.emit('left',{}),new Promise(r=>setTimeout(r,400))])}catch(e){}}menu()}
function spraySome(){if(!S||S.turn!==me||S.over)return;const t=al(S).filter(x=>x!==me);if(t.length===1){aim=0;go({k:'shoot',t:t[0]});return}aim=aim?0:1;render()}
function aimAt(i){aim=0;go({k:'shoot',t:i})}
function cfgSet(k,v){(setupF?cfgF:cfgB)[k]=v;render()}
function kick(i,ban){const x=lob.ps[i];if(!x||!x.peer)return;if(ban){banned.add(x.peer);if(x.by)banned.add(x.by)}R.emit('kick',{p:x.peer,r:ban?'ban':''}).catch(()=>{});lob.ps.splice(i,1);lob.m=x.n+(ban?' was banned':' was kicked');blob();render()}
function ban(i){kick(i,1)}
function gone(pe){if(!R||!pe)return;
 if(mode==='guest'){if(pe!==hp)return;const n=(lob&&lob.ps[0]&&lob.ps[0].n)||(S&&S.nm[0])||'Host';menu();toast(n+' left the game',4500);return}
 if(mode!=='host'||!lob)return;const i=lob.ps.findIndex(x=>x.peer===pe);if(i<1)return;const n=lob.ps[i].n;
 if(S&&!S.over){R.emit('end',{n}).catch(()=>{});setTimeout(()=>{menu();toast(n+' left the game',4500)},300)}
 else{lob.ps.splice(i,1);lob.m=n+' left';blob();toast(n+' left',2500);render()}}
function showEmo(e,mine){const d=document.createElement('div');d.className='emo';d.textContent=e;d.style.left=(10+rnd(70))+'%';d.style.top=mine?'70%':'30%';d.style.color=mine?'#b6ff00':'#ff2e93';document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
const EM=['🔥','😂','😤','💀','GG'];
function emo(e){if(R)R.emit('emo',{e}).catch(()=>{});showEmo(e,true);snd(800,.06)}
function hookEmo(){
 R.on('left',m=>{if(!m.sameTab)gone(m.peer)});
 R.on('end',m=>{if(mode==='guest'&&m.peer===hp&&!m.sameTab){const n=String(m.data&&m.data.n||'A player').slice(0,16);menu();toast(n+' left the game',4500)}});
 R.on('kick',m=>{if(mode==='guest'&&m.peer===hp&&!m.sameTab&&m.data&&m.data.p===myPeer){const b=m.data.r==='ban';menu();toast(b?'You were banned by the host':'You were kicked by the host',4000)}});
 R.on('deny',m=>{const d=m.data;if(mode==='guest'&&!lob&&!S&&d&&d.p===myPeer){menu();toast(d.r==='ban'?'You are banned from this room':d.r==='full'?'This room is full (4 players max)':'A game is already in progress',4000)}});
 R.on('emo',m=>{if(m.sameTab)return;const e=String(m.data&&m.data.e||'');if(EM.includes(e))showEmo(e,false)});
 R.onPeers(c=>c.left.forEach(x=>gone(x.peer)))}
async function room(){if(!window.Peer)return null;return RM||(RM=SHIM)}
async function mkRoom(){if(!await room())return toast('Multiplayer failed to load. Check your internet connection.');
 const al2='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';R=null;for(let t=0;t<4&&!R;t++){code='';for(let i=0;i<5;i++)code+=al2[rnd(al2.length)];try{R=await RM.host('rr-'+code.toLowerCase())}catch(e){if(e.code!=='unavailable-id')return toast('Could not open room: '+(e.code||'error'))}}if(!R)return toast('Could not create a room, try again');
 mode='host';me=0;S=null;banned=new Set();lob={ps:[{peer:null,n:nm16(SV.name,'HOST'),c:SV.sel,k:SV.perk}],b:cfgF.bots,bo:cfgF.bo,m:''};scr='lobby';
 R.on('hi',m=>{if(m.sameTab||!lob)return;const d=m.data||{},dn=r=>R.emit('deny',{p:m.peer,r}).catch(()=>{});if(banned.has(m.peer)||(m.by&&banned.has(m.by)))return dn('ban');
  if(lob.ps.some(x=>x.peer===m.peer)){if(S&&S.pe.includes(m.peer))bc();else blob();return}
  if(S&&!S.over)return dn('start');if(lob.ps.length+lob.b>=4)return dn('full');
  const used=lob.ps.map(x=>x.c);let c=(+d.c||0)%COL.length;while(used.includes(c))c=(c+1)%COL.length;
  const n=nm16(d.n,'PLAYER '+(lob.ps.length+1));lob.ps.push({peer:m.peer,by:m.by,n,c,k:!!d.p});lob.m=n+' joined!';toast(n+' joined!');snd(700,.15);blob();render()});
 R.on('act',m=>{if(m.sameTab||!S)return;const i=S.pe.indexOf(m.peer);if(i<1)return;apply(S,i,m.data);sync()});
 hookEmo();clearInterval(hbT);hbT=setInterval(()=>{if(!lob)return;if(S&&!S.over)bc();else{blob();if(S)bc()}},2500);render()}
async function joinRoom(){const c=(document.getElementById('jc').value||'').trim().toLowerCase();if(c.length<3)return toast('Enter the room code');
 if(!await room())return toast('Multiplayer failed to load. Check your internet connection.');
 try{R=await RM.join('rr-'+c)}catch(e){return toast(e.code==='peer-unavailable'?'No room with that code':'Could not join: '+(e.code||'error'))}
 mode='guest';S=null;lob=null;hp=null;myPeer=null;paid=0;lastEv=-1;scr='lobby';hookEmo();render();
 R.on('hi',m=>{if(m.sameTab)myPeer=m.peer});
 R.on('lob',m=>{if(m.sameTab)return;if(!hp)hp=m.peer;else if(m.peer!==hp)return;lob=m.data;clearInterval(hiT);if(!S)scr='lobby';render()});
 R.on('st',m=>{if(m.sameTab||!myPeer)return;const d=m.data;if(!d||!d.pe||!d.pe.includes(myPeer))return;if(!hp)hp=m.peer;else if(m.peer!==hp)return;
  const old=S;S=d;me=d.pe.indexOf(myPeer);if(old&&old.over&&!S.over){paid=0;lastEv=-1}scr='game';clearInterval(hiT);render()});
 const hi=()=>R&&!S&&!lob&&R.emit('hi',{c:SV.sel,p:SV.perk,n:SV.name||''}).catch(()=>{});hi();clearInterval(hiT);hiT=setInterval(hi,1500);
 setTimeout(()=>{if(mode==='guest'&&!S&&!lob){toast('No host found, or the room is full');menu()}},9000)}

/* ---------- views ---------- */
const coin=()=>`<div class="coin">💲 ${SV.coins}</div>`;
function V_menu(){return `${coin()}<h1>SPRAY<span>ROULETTE</span></h1><div class="sub">one live can in the cylinder… tag or get tagged</div>
<button class="b" style="--c:var(--lime)" onclick="setupF=0;scr='setup';render()">▶ Vs Bot</button>
<button class="b" style="--c:var(--cyan)" onclick="mode='';scr='lobby';render()">🔑 Friend Room</button>
<button class="b" style="--c:var(--gold)" onclick="scr='shop';render()">🛒 Shop</button>
<button class="b" style="--c:var(--pink)" onclick="scr='how';render()">❓ How To Play</button>
<div class="row"><button class="b sm" style="--c:var(--vio)" onclick="SV.snd=!SV.snd;save();render()">Sound: ${SV.snd?'ON':'OFF'}</button></div>
<div class="sub">W ${SV.w} · L ${SV.l}</div><div class="panel"><div class="sub">Your name (max 16)</div><input id="nm" class="nin" maxlength="16" placeholder="PLAYER" value="${esc(SV.name||'')}" oninput="SV.name=this.value.slice(0,16);save()"></div>`}
function V_how(){return `<h2>HOW TO PLAY</h2><div class="panel"><ul>
<li>The paint revolver has <b>6 chambers</b> with <b>1–2 live cans</b>. Everyone can see how many.</li>
<li>Play with <b>2–4 players</b>: mix bots and friends.</li>
<li>On your turn, spray any player or spray <b>yourself</b>. A blank on yourself means <b>go again</b>.</li>
<li>A live hit costs 1 life (3 total), reloads the cylinder and passes the turn. Last one standing wins.</li>
<li>You <b>draw 1 power-up each turn</b> and keep what you already have. Max hand is <b>3</b>; a full hand skips the draw.</li>
<li>Power-ups (use any time on your turn): 👁️ Peek · 🌀 Spin · 🛡️ Shield · 💥 Double · 💚 Heal · 🏃 Steal · ⛓️ Cuff (next player skips) · 🔁 Flip chamber.</li>
<li><b>Rounds:</b> pick 1, 3 or 5 sets. First to win the majority takes the match.</li>
<li>Friend Room: the host sets bots and rounds, shares the code, kicks players if needed and presses Start. Emotes are on!</li>
<li>Win to earn 💲 and spend it in the <b>Shop</b>.</li></ul></div>
<button class="b" onclick="menu()">← Back</button>`}
function V_shop(){return `${coin()}<button class="b" onclick="menu()">← Back</button><h2>SHOP</h2><div class="sub">Scroll down ⬇ for more options</div><div class="grid">${COL.map((c,i)=>{const o=SV.owned.includes(i),sel=SV.sel===i;
return `<div class="panel shopc"><div class="sw" style="--c:${c[1]}"></div>${c[0]}<br><button class="b sm" style="--c:${sel?'var(--lime)':o?'var(--cyan)':'var(--gold)'}" onclick="buy(${i})">${sel?'Equipped':o?'Equip':'💲 '+c[2]}</button></div>`}).join('')}
<div class="panel shopc" style="grid-column:span 2">🎁 <b>Starter Pack</b><br>Begin every match with +1 power-up<br><button class="b sm" style="--c:${SV.perk?'var(--lime)':'var(--gold)'}" onclick="buyPerk()">${SV.perk?'Owned':'💲 250'}</button></div>${CYL.map((c,i)=>{const o=SV.cyo.includes(i),sel=SV.cy===i;return `<div class="panel shopc"><div class="sw" style="--c:${c[1]};border-radius:12px"></div>Cylinder: ${c[0]}<br><button class="b sm" style="--c:${sel?'var(--lime)':o?'var(--cyan)':'var(--gold)'}" onclick="buyCy(${i})">${sel?'Equipped':o?'Equip':'💲 '+c[2]}</button></div>`}).join('')}<div class="panel shopc" style="grid-column:span 2">💰 <b>2x Coins</b><br>Double all match rewards<br><button class="b sm" style="--c:${SV.x2?'var(--lime)':'var(--gold)'}" onclick="buyX2()">${SV.x2?'Owned':'💲 500'}</button></div></div>`}
function buy(i){const c=COL[i];if(SV.owned.includes(i)){SV.sel=i}else if(SV.coins>=c[2]){SV.coins-=c[2];SV.owned.push(i);SV.sel=i;snd(700,.2)}else toast('Not enough coins!');save();render()}
function buyCy(i){const c=CYL[i];if(SV.cyo.includes(i)){SV.cy=i}else if(SV.coins>=c[2]){SV.coins-=c[2];SV.cyo.push(i);SV.cy=i;snd(700,.2)}else toast('Not enough coins!');save();render()}
function buyX2(){if(SV.x2)return;if(SV.coins>=500){SV.coins-=500;SV.x2=true;snd(700,.2)}else toast('Not enough coins!');save();render()}
function buyPerk(){if(SV.perk)return;if(SV.coins>=250){SV.coins-=250;SV.perk=true;snd(700,.2)}else toast('Not enough coins!');save();render()}
function V_lobby(){
 if(!mode)return `<h2>FRIEND ROOM</h2><button class="b" style="--c:var(--lime)" onclick="setupF=1;scr='setup';render()">Create Room</button><div class="panel"><div class="sub">Have a code?</div><input id="jc" maxlength="8" placeholder="CODE"><br><br><button class="b" style="--c:var(--cyan)" onclick="joinRoom()">Join Room</button></div><button class="b" onclick="menu()">← Back</button>`;
 if(!lob)return `<h2>JOINING…</h2><div class="panel sub">Connecting to host…</div><button class="b" onclick="quit()">← Cancel</button>`;
 const L=lob,host=mode==='host',tot=L.ps.length+L.b;
 return `<h2>FRIEND ROOM</h2><div class="panel"><div class="sub">Room code</div><div class="big">${esc((host?code:L.code||'').toUpperCase())}</div><div class="sub">${L.b} bot${L.b==1?'':'s'} · best of ${L.bo} · ${tot} players</div></div>
<div class="panel">${L.m?`<div class="sub" style="color:var(--lime)">${esc(L.m)}</div>`:''}
${L.ps.map((x,i)=>`<div class="row" style="align-items:center;margin:6px 0"><div class="sub" style="text-align:left;flex:2;color:${COL[x.c][1]}">${i?'':'👑 '}${esc(x.n)}</div>${host&&i?`<button class="b sm" style="--c:var(--gold);flex:1" onclick="kick(${i})">Kick</button><button class="b sm" style="--c:var(--pink);flex:1" onclick="ban(${i})">Ban</button>`:''}</div>`).join('')}
${Array(L.b).fill(0).map((_,j)=>`<div class="sub" style="text-align:left">🤖 BOT ${j+1}</div>`).join('')}</div>
<div class="sub">${host?(tot<2?'Waiting for your friend to join…':'Ready when you are!'):'Waiting for host to start game…'}</div>
<button class="b" onclick="quit()">${host?'← Cancel':'← Leave'}</button>
${host?`<button class="b" style="--c:var(--lime)" ${tot<2?'disabled':''} onclick="startGame()">▶ Start Game</button>`:''}`}
function V_setup(){const c=setupF?cfgF:cfgB,opt=(k,vals)=>vals.map(n=>`<button class="b sm" style="--c:${c[k]===n?'var(--lime)':'var(--paper)'}" onclick="cfgSet('${k}',${n})">${n}</button>`).join('');
 return `<h2>${setupF?'CREATE ROOM':'VS BOTS'}</h2>
<button class="b" style="--c:var(--lime)" onclick="${setupF?'mkRoom()':'startBot()'}">${setupF?'▶ Create Room':'▶ Play'}</button>
<div class="panel"><div class="sub">Bots</div><div class="row">${opt('bots',setupF?[0,1,2,3]:[1,2,3])}</div><div class="sub">${setupF?'Friends fill the other seats (4 max)':(c.bots+1)+' players total'}</div></div>
<div class="panel"><div class="sub">Rounds (best of)</div><div class="row">${opt('bo',[1,3,5])}</div></div>
<button class="b" onclick="menu()">← Back</button>`}
function cyl(s){let g='';for(let i=0;i<6;i++){const a=i*60*Math.PI/180,x=100+Math.sin(a)*58,y=100-Math.cos(a)*58,k=i===s.pos&&s.seen[me]!==null;
 const f=i<s.pos?'#333':k?(s.seen[me]?'#ff2e93':'#7cff7c'):'#0b0b0b';g+=`<circle cx="${x}" cy="${y}" r="21" fill="${f}" stroke="#fff7e0" stroke-width="3"/>`+(i<s.pos?`<text x="${x}" y="${y+6}" fill="#777" font-size="18" text-anchor="middle">✕</text>`:k?`<text x="${x}" y="${y+7}" font-size="20" text-anchor="middle">${s.seen[me]?'💥':'✔'}</text>`:'')}
 return `<svg class="cyl" viewBox="0 0 200 200"><polygon points="100,2 90,-12 110,-12" fill="#b6ff00" stroke="#000" stroke-width="3"/><circle cx="100" cy="100" r="92" fill="${CYL[SV.cy][1]}" stroke="#000" stroke-width="6"/><g class="rot" style="transform:rotate(${-s.pos*60}deg)">${g}<circle cx="100" cy="100" r="14" fill="${COL[s.col[me]][1]}" stroke="#000" stroke-width="4"/></g></svg>`}
function V_game(){if(!S)return `<h2>Connecting…</h2>`;const s=S,c=i=>COL[s.col[i]][1],mine=s.turn===me&&!s.over,opp=s.hp.map((h,i)=>i).filter(i=>i!==me);
 const card=i=>`<div class="card${aim&&mine&&i!==me&&s.hp[i]>0?' aim':''}"${aim&&mine&&i!==me&&s.hp[i]>0?` onclick="aimAt(${i})"`:''} style="--c:${c(i)};min-width:110px;${s.hp[i]>0?'':'opacity:.35'}"><b>${esc(s.nm[i])}</b>${s.turn===i&&!s.over?'<i class="tn">TURN</i>':''}<div class="hp" style="color:${c(i)}">${[0,1,2].map(k=>k<s.hp[i]?'♥':'♡').join('')}</div><div class="sm">${s.sh[i]?'🛡️ ':''}${s.db[i]?'💥 ':''}${s.cf[i]?'⛓️ ':''}${i!==me?'🎒 '+s.it[i].length+' ':''}${s.hp[i]>0?'':'OUT'}</div></div>`;
 const live=s.cyl.reduce((a,b)=>a+b,0);
 return `<div class="top"><button class="b sm" style="--c:var(--pink)" onclick="quit()">✕ Quit</button>${coin()}</div><div class="row" style="flex-wrap:wrap">${opp.map(card).join('')}</div>
 <div class="chips"><span class="chip">LIVE: ${live}</span><span class="chip">LEFT: ${6-s.pos}</span>${s.bo>1?`<span class="chip" style="background:var(--gold);color:#000">SETS ${s.rw.join('-')}</span>`:''}${s.seen[me]!==null&&s.seen[me]!==undefined?`<span class="chip" style="background:var(--pink)">👁️ NEXT: ${s.seen[me]?'LIVE':'BLANK'}</span>`:''}</div>
 ${cyl(s)}<div class="log">${esc(s.log)}</div>${card(me)}
 <div class="items">${s.it[me].map((k,i)=>`<button class="it" data-tip="${TIP[k]}" ${mine?'':'disabled'} onclick="go({k:'item',i:${i}})">${IT[k][0]}<small>${IT[k][1]}</small></button>`).join('')||'<span class="sm">No power-ups</span>'}</div>
 <div class="row"><button class="b" style="--c:var(--pink)" ${mine?'':'disabled'} onclick="spraySome()">${aim?'Pick a target…':'Spray Someone'}</button><button class="b" style="--c:var(--cyan)" ${mine?'':'disabled'} onclick="aim=0;go({k:'shoot',t:${me}})">Spray Me</button></div>
 ${mode==='host'||mode==='guest'?`<div class="row">${EM.map(e=>`<button class="it" onclick="emo('${e}')">${e}</button>`).join('')}</div>`:''}
 ${s.over?V_over():''}`}
function V_over(){const w=S.over-1===me;return `<div class="splat" style="--c:${COL[S.col[S.over-1]][1]};pointer-events:auto;animation:none;background:rgba(0,0,0,.8);flex-direction:column;gap:14px;padding:20px"><div class="big" style="color:${w?'var(--lime)':'var(--pink)'}">${w?'YOU WIN':'TAGGED OUT'}</div><div class="sub">${esc(S.nm[S.over-1])} wins · +${(w?(S.bo>1?100:60):10)*(SV.x2?2:1)} 💲</div>
 ${mode==='guest'?'<div class="sub">Host can start a rematch</div>':'<button class="b" style="--c:var(--lime);max-width:320px" onclick="again()">Rematch</button>'}<button class="b" style="max-width:320px" onclick="quit()">Menu</button></div>`}
function render(){const a=document.getElementById('app'),v={menu:V_menu,how:V_how,shop:V_shop,lobby:V_lobby,setup:V_setup,game:V_game}[scr];if(!S||S.turn!==me||S.over)aim=0;a.innerHTML=v();fitText();
 if(S&&scr==='game'){
  if(S.over&&!paid){paid=1;const mu=SV.x2?2:1;if(S.over-1===me){SV.coins+=(S.bo>1?100:60)*mu;SV.w++}else{SV.coins+=10*mu;SV.l++}save();setTimeout(render,50)}
  if(S.ev!==lastEv){const first=lastEv===-1;lastEv=S.ev;const f=S.fx;if(f&&!first){const hit=f.t==='splat',ok=hit&&f.who!==me;const w=hit?(ok?(f.by===me?'You sprayed '+S.nm[f.who]:S.nm[f.who]+' sprayed'):'SPLAT!'):{blank:'CLICK',block:'BLOCKED!',item:''}[f.t];
   if(w){const d=document.createElement('div');d.className=ok?'ok':'splat';d.style.setProperty('--c',COL[S.col[f.who]][1]);d.innerHTML=(hit&&!ok?'<i></i>':'')+'<em>'+esc(w)+'</em>';document.body.appendChild(d);setTimeout(()=>d.remove(),950)}
   if(f.r)setTimeout(()=>{const n=document.createElement('div');n.className='splat';n.innerHTML='<em>NEW ROUND</em>';document.body.appendChild(n);setTimeout(()=>n.remove(),950)},1000);
   if(f.t==='splat'){snd(110,.35,'sawtooth',.12);a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}else if(f.t==='blank')snd(900,.05);else if(f.t==='block')snd(500,.2);else snd(600,.12,'triangle')}}}
}
addEventListener('pagehide',()=>{if(R&&(mode==='host'||mode==='guest'))R.emit('left',{}).catch(()=>{})});
if(document.fonts)document.fonts.ready.then(fitText);render();
</script></body></html>
