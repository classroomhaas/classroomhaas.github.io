<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Imposter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#0a0a10;--card:#14141d;--line:#252534;--tx:#f2f2f7;--mu:#8a8aa0;--ac:#ff3b5c;--ac2:#ff7a3b;--ok:#3be8a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#2a0f1c 0%,var(--bg) 60%) fixed,var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
#app{max-width:460px;margin:0 auto;padding:28px 20px 40px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:44px;letter-spacing:-1.5px;margin:30px 0 4px;font-weight:800}
h1 span{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:26px;margin:8px 0 6px;letter-spacing:-.5px}
p.sub{color:var(--mu);margin:0 0 24px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
button{font:inherit;color:var(--tx);cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:15px 18px;width:100%;font-weight:600;transition:transform .12s,border-color .2s,background .2s;margin-bottom:10px}
button:hover{border-color:#44445e}button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;box-shadow:0 8px 24px -8px var(--ac)}
button.ghost{background:transparent;color:var(--mu)}
button:disabled{opacity:.4;pointer-events:none}
input,select{font:inherit;width:100%;background:#0e0e16;border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:15px 16px;outline:none;margin-bottom:10px;transition:border-color .2s}
input:focus,select:focus{border-color:var(--ac)}
input.code{text-align:center;letter-spacing:10px;font-size:26px;font-weight:700;text-transform:uppercase}
.row{display:flex;gap:10px}.row>*{flex:1}
.chip{display:flex;justify-content:space-between;align-items:center;background:#0e0e16;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;animation:in .25s}
.chip small{color:var(--mu)}.x{cursor:pointer;color:var(--mu);padding:0 4px}
.big{font-size:54px;font-weight:800;text-align:center;letter-spacing:-1px;margin:18px 0;line-height:1.1}
.role{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.role .lbl{color:var(--mu);font-size:13px;letter-spacing:2px;text-transform:uppercase}
.imp{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.code-show{font-size:48px;font-weight:800;letter-spacing:12px;text-align:center;margin:6px 0 14px;padding-left:12px}
.bar{height:6px;background:#0e0e16;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.back{background:none;border:0;color:var(--mu);width:auto;padding:6px 0;margin:0 0 10px}
.err{color:var(--ac);font-size:14px;min-height:20px;margin-bottom:6px}
.sel{border-color:var(--ac)!important;background:#2a1220}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:8px}
.pk{display:inline-block;width:auto;padding:8px 14px;margin:0 6px 6px 0;font-size:14px;border-radius:999px}.pk.on{border-color:var(--ac);background:#2a1220}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.set select{width:auto;margin:0;padding:10px 12px}.set input[type=checkbox]{width:24px;height:24px;margin:0;accent-color:var(--ac)}
.tm{font-size:60px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:14px 0}.tm.up{color:var(--ac);animation:pl 1s infinite}@keyframes pl{50%{opacity:.4}}
.mini{width:auto;padding:6px 10px;margin:0 0 0 6px;font-size:12px;border-radius:9px;color:var(--mu)}.mini.bn{color:var(--ac);border-color:#4a1d2b}span.pk{border:1px solid var(--ac);background:#2a1220}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const WORDS={
"Food":["Pizza","Sushi","Taco","Pancake","Burger","Ice cream","Popcorn","Spaghetti","Donut","Gumbo","Cheese","Chocolate","Sandwich","Waffle","Pickle"],
"Places":["Beach","Library","Airport","Hospital","Casino","Zoo","Museum","Cinema","Castle","Desert","Submarine","Gym","Circus","Farm","Volcano"],
"Animals":["Penguin","Giraffe","Octopus","Kangaroo","Owl","Shark","Panda","Camel","Flamingo","Hedgehog","Dolphin","Spider","Wolf","Turtle","Bat"],
"Things":["Umbrella","Mirror","Guitar","Telescope","Backpack","Candle","Scissors","Compass","Camera","Hammock","Skateboard","Lantern","Clock","Key","Piano"],
"Jobs":["Pilot","Chef","Detective","Firefighter","Astronaut","Dentist","Magician","Farmer","Lifeguard","Barber","Plumber","Pirate","Teacher","DJ","Spy"],
"Sports":["Soccer","Tennis","Surfing","Boxing","Golf","Archery","Bowling","Rugby","Skiing","Fencing","Baseball","Karate","Rowing","Darts","Marathon"],
"Nature":["Waterfall","Rainbow","Glacier","Cactus","Thunderstorm","Coral reef","Canyon","Swamp","Meadow","Tornado","Cave","Island","Sunrise","Geyser","Rainforest"],
"Tech":["Robot","Drone","Satellite","Laptop","Headphones","Router","Smartwatch","Printer","Microchip","Joystick","Webcam","Battery","Hologram","Password","Keyboard"],
"Music":["Drums","Violin","Choir","Karaoke","Saxophone","Concert","Microphone","Orchestra","Harmonica","Opera","Banjo","Metronome","Festival","Vinyl","Trumpet"],
"Household":["Toaster","Couch","Vacuum","Bathtub","Ladder","Doorbell","Blender","Pillow","Fridge","Curtain","Broom","Lamp","Closet","Kettle","Doormat"]};
const ST={timer:120,imps:1,guess:false,packs:Object.keys(WORDS)};
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function draw(){const c=pick(ST.packs.length?ST.packs:Object.keys(WORDS));return{cat:c,word:pick(WORDS[c])}}
const pc=()=>S.screen==='online'?ON.players.length:S.names.length,maxImps=n=>Math.max(1,Math.floor((n-1)/2)),nImps=n=>Math.min(ST.imps,maxImps(n)),fmt=s=>s?s/60+' min':'Off';
let S={screen:'home',names:[],cat:'Random',err:'',peek:false};
let PP={},ON={db:null,id:'p'+Math.random().toString(36).slice(2,8),code:'',game:null,players:[],name:'',unsubs:[]};
function go(s,extra){S={...S,screen:s,err:'',peek:false,...extra};render()}
const settings=()=>`<div class="card"><div class="set"><span>Discussion timer</span><select onchange="ST.timer=+this.value;cfgSync()">${[0,60,120,180,300].map(t=>`<option value="${t}" ${t===ST.timer?'selected':''}>${fmt(t)}</option>`).join('')}</select></div>
<div class="set"><span>Imposters<br><small style="color:var(--mu)">2 needs 5+ players, 3 needs 7+</small></span><select onchange="ST.imps=+this.value;cfgSync()">${[1,2,3].filter(k=>k<=maxImps(pc())).map(k=>`<option ${k===nImps(pc())?'selected':''}>${k}</option>`).join('')}</select></div>
<div class="set"><span>Imposter guesses the word<br><small style="color:var(--mu)">last chance if caught</small></span><input type="checkbox" ${ST.guess?'checked':''} onchange="ST.guess=this.checked;cfgSync()"></div>
<div style="color:var(--mu);font-size:13px;margin:4px 0 8px">Word packs</div>${Object.keys(WORDS).map(c=>`<button class="pk ${ST.packs.includes(c)?'on':''}" onclick="togPack(this,'${c}')">${c}</button>`).join('')}</div>`;
function togPack(b,c){const i=ST.packs.indexOf(c);if(i>=0){if(ST.packs.length>1){ST.packs.splice(i,1);b.classList.remove('on')}}else{ST.packs.push(c);b.classList.add('on')}cfgSync()}
/* ---------- screens ---------- */
function render(){const f=V[S.screen];$.innerHTML=f();const i=$.querySelector('[autofocus]');if(i)i.focus()}
const V={
home:()=>`<h1><span>IMPOSTER</span></h1><p class="sub">One of you doesn’t know the word. Find them before they blend in.</p>
<button class="pri" onclick="go('ppnames')">Pass &amp; Play</button>
<button onclick="go('onhome')">Play Online</button>
<div class="card" style="margin-top:20px"><p class="sub" style="margin:0;font-size:14px">Everyone gets the same secret word except the imposter. Take turns giving one-word clues, then vote on who’s faking it.</p></div>
<p style="text-align:center;color:var(--mu);font-size:12px;letter-spacing:.5px;margin:18px 0 0">© BillyBobGamesV2 2026</p>`,
/* pass & play */
ppnames:()=>`<button class="back" onclick="go('home')">← Back</button><h2>Who’s playing?</h2><p class="sub">Add at least 3 players.</p>
<div class="row"><input id="nm" placeholder="Player name" maxlength="14" autofocus onkeydown="if(event.key==='Enter')addName()"><button style="flex:0 0 80px;margin:0;height:52px" onclick="addName()">Add</button></div><div style="height:10px"></div>
${S.names.map((n,i)=>`<div class="chip">${esc(n)}<span class="x" onclick="S.names.splice(${i},1);render()">✕</span></div>`).join('')}
<div class="err">${S.err}</div>${settings()}
<button class="pri" ${S.names.length<3?'disabled':''} onclick="ppStart()">Start Game</button>`,
pppass:()=>`<div style="text-align:center;margin-top:60px"><p class="sub">Pass the phone to</p><div class="big">${esc(S.names[PP.i])}</div>
<p class="sub">${PP.i+1} of ${S.names.length}</p></div><button class="pri" style="margin-top:40px" onclick="go('ppreveal')">I’m ${esc(S.names[PP.i])} — show my role</button>`,
ppreveal:()=>{const imp=PP.imps.includes(PP.i);return`<div class="card role"><span class="lbl">${esc(S.names[PP.i])}, you are</span>${imp?`<div class="big imp">IMPOSTER</div><p class="sub">Blend in. Don’t get caught.</p>`:`<div class="lbl" style="margin-top:14px">The word is</div><div class="big">${esc(PP.word)}</div><p class="sub">Category: ${esc(PP.cat)}</p>`}</div>
<button class="pri" onclick="ppNext()">${PP.i+1<S.names.length?'Hide &amp; pass on':'Hide &amp; start'}</button>`},
ppdiscuss:()=>`<div style="text-align:center;margin-top:40px"><span class="lbl sub">Round on</span><h2>Discussion</h2><p class="sub"><b style="color:var(--tx)">${esc(S.names[PP.start])}</b> goes first. Each player gives one clue about the word, then debate and vote out loud.</p></div>
<div class="card"><p class="sub" style="margin:0;text-align:center">Category: <b style="color:var(--tx)">${esc(PP.cat)}</b> · ${PP.imps.length} imposter${PP.imps.length>1?'s':''}</p></div>${ST.timer?'<div class="tm" id="tm"></div>':''}
<button class="pri" onclick="go('ppresult')">Reveal the imposter</button>`,
ppresult:()=>`${ppRes()}
<button class="pri" style="margin-top:24px" onclick="ppStart()">Play again</button><button onclick="go('ppnames')">Edit players</button><button class="ghost" onclick="go('home')">Home</button>`,
/* online */
onhome:()=>`<button class="back" onclick="go('home')">← Back</button><h2>Play online</h2><p class="sub">Enter your name, then create a lobby or join with a code.</p>
<input id="nm" placeholder="Your name" maxlength="14" value="${esc(ON.name)}" autofocus>
<button class="pri" onclick="onCreate()">Create lobby</button>
<div class="card"><input id="cd" class="code" placeholder="CODE" maxlength="4"><button onclick="onJoin()" style="margin:0">Join lobby</button></div><div class="err">${S.err}</div>`,
online:()=>{const g=ON.game,P=ON.players,host=g&&g.host===ON.id,me=P.find(p=>p.id===ON.id);if(!g)return'<p class="sub">Connecting…</p>';
const hdr=`<div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl sub" style="font-size:13px">LOBBY ${ON.code}</span><button class="back" onclick="onLeave()">Leave</button></div>`;
if(g.phase==='lobby')return hdr+`<p class="sub" style="text-align:center;margin:10px 0 0">Share this code</p><div class="code-show">${ON.code}</div>
<div class="card">${P.map(p=>`<div class="chip"><span><span class="dot"></span>${esc(p.name)}${p.id===g.host?' <small>host</small>':''}${p.id===ON.id?' <small>you</small>':''}</span>${pCtl(p,host)}</div>`).join('')}</div>
${host?`${settings()}<button class="pri" ${P.length<3?'disabled':''} onclick="onStart()">${P.length<3?'Need 3+ players':'Start game'}</button>`:`${cfgView(g.cfg,P.length)}<p class="sub" style="text-align:center">Waiting for the host to start…</p>`}`;
const imp=(g.imps||[]).includes(ON.id);
if(g.phase==='role')return hdr+`<div class="card role" onclick="S.peek=!S.peek;render()">${S.peek?(imp?`<div class="big imp">IMPOSTER</div><p class="sub">Blend in. Tap to hide.</p>`:`<div class="lbl">The word is</div><div class="big">${esc(g.word)}</div><p class="sub">${esc(g.cat)} · tap to hide</p>`):`<div class="lbl">Tap to reveal your role</div><div class="big" style="font-size:38px">🤫</div>`}</div>
${host?`<button class="pri" onclick="onDisc()">Start discussion</button>`:'<p class="sub" style="text-align:center">Waiting for host to begin discussion…</p>'}`;
if(g.phase==='discuss')return hdr+`<div style="text-align:center;margin-top:20px"><h2>Discussion</h2><p class="sub"><b style="color:var(--tx)">${esc(nameOf(g.start))}</b> goes first. One clue each, then vote.</p></div>
<div class="card role" style="min-height:110px" onclick="S.peek=!S.peek;render()">${S.peek?(imp?'<div class="big imp" style="font-size:30px;margin:0">IMPOSTER</div>':`<div class="big" style="font-size:30px;margin:0">${esc(g.word)}</div>`):'<span class="lbl">Tap to peek at your role</span>'}</div>
${g.endsAt?'<div class="tm" id="tm"></div>':''}${host?`<button class="pri" onclick="onSet({phase:'vote'})">Call the vote</button>`:'<p class="sub" style="text-align:center">Host will call the vote…</p>'}`;
const votes=P.filter(p=>p.vote&&p.vote.r===g.round);
if(g.phase==='guess')return hdr+(g.caught===ON.id?`<h2>You were caught!</h2><p class="sub">Guess the secret word to steal the win.</p><input id="gs" placeholder="Your guess" autofocus onkeydown="if(event.key==='Enter')onGuess()"><button class="pri" onclick="onGuess()">Submit guess</button>`:`<div style="text-align:center;margin-top:40px"><h2>${esc(nameOf(g.caught))} was caught</h2><p class="sub">They’re guessing the word…</p></div>`);
if(g.phase==='vote')return hdr+`<h2>Who’s the imposter?</h2><p class="sub">${votes.length} of ${P.length} voted</p><div class="bar"><i style="width:${votes.length/P.length*100}%"></i></div><div style="height:16px"></div>
${P.filter(p=>p.id!==ON.id).map(p=>`<button class="${me&&me.vote&&me.vote.r===g.round&&me.vote.to===p.id?'sel':''}" onclick="onVote('${p.id}')">${esc(p.name)}</button>`).join('')}`;
const {t,caught}=tally();const win=caught&&!(g.guess&&g.guess.trim().toLowerCase()===String(g.word).toLowerCase());
return hdr+`<div style="text-align:center;margin-top:10px"><p class="sub">The imposter${g.imps.length>1?'s were':' was'}</p><div class="big imp" style="font-size:${g.imps.length>1?34:54}px">${g.imps.map(i=>esc(nameOf(i))).join(' &amp; ')}</div><p class="sub">Word: <b style="color:var(--tx)">${esc(g.word)}</b></p>
<div class="card" style="color:${win?'var(--ok)':'var(--ac)'};font-weight:700">${win?'Caught! Crew wins 🎉':(caught?'Imposter steals the win 😈':'Escaped! Imposter wins 😈')}${g.guess?`<div style="font-size:14px;color:var(--mu);font-weight:400;margin-top:6px">Imposter guessed “${esc(g.guess)}”</div>`:''}</div></div>
<div class="card">${P.map(p=>`<div class="chip"><span>${esc(p.name)}</span><span style="display:flex;align-items:center"><small>${t[p.id]||0} vote${(t[p.id]||0)===1?'':'s'}</small>${pCtl(p,host)}</span></div>`).join('')}</div>
${host?`<button class="pri" onclick="onStart()">Play again</button>`:'<p class="sub" style="text-align:center">Waiting for host…</p>'}`}
};
const nameOf=id=>(ON.players.find(p=>p.id===id)||{name:'?'}).name;
/* ---------- pass & play logic ---------- */
function addName(){const el=document.getElementById('nm'),v=el.value.trim();if(!v)return;if(S.names.length>=12){S.err='Max 12 players';return render()}
if(S.names.some(n=>n.toLowerCase()===v.toLowerCase())){S.err='That name is taken';return render()}S.names.push(v);S.err='';render()}
function ppStart(){const d=draw(),n=S.names.length,idx=[...Array(n).keys()].sort(()=>Math.random()-.5);PP={...d,i:0,imps:idx.slice(0,nImps(n)),start:Math.floor(Math.random()*n)};go('pppass',{gdone:false,gres:''})}
function ppRes(){const im=PP.imps.map(i=>esc(S.names[i])).join(' &amp; '),multi=PP.imps.length>1;
return`<div style="text-align:center;margin-top:30px"><p class="sub">The imposter${multi?'s were':' was'}</p><div class="big imp" style="font-size:${multi?34:54}px">${im}</div>
${ST.guess&&!S.gdone?`<div class="card" style="text-align:left"><p class="sub" style="margin:0 0 12px">If caught, the imposter gets one guess at the word.</p><input id="gs" placeholder="Imposter’s guess" autofocus onkeydown="if(event.key==='Enter')ppGuess()"><button class="pri" style="margin:0" onclick="ppGuess()">Submit guess</button><button class="ghost" style="margin:8px 0 0" onclick="ppGuess(1)">Skip</button></div>`:`${S.gres?`<p style="font-weight:700;color:${S.gres==='ok'?'var(--ac)':'var(--ok)'}">${S.gres==='ok'?'Correct guess — the imposter steals the win!':'Wrong guess — the crew wins!'}</p>`:''}<p class="sub">The word was</p><div class="big" style="font-size:38px">${esc(PP.word)}</div>`}</div>`}
function ppGuess(skip){let r='';if(!skip){const v=(document.getElementById('gs').value||'').trim().toLowerCase();r=v===PP.word.toLowerCase()?'ok':'no'}S.gdone=true;S.gres=r;render()}
function ppNext(){PP.i++;if(PP.i>=S.names.length)PP.end=ST.timer?Date.now()+ST.timer*1000:0;go(PP.i<S.names.length?'pppass':'ppdiscuss')}
/* ---------- online (peer-to-peer) ---------- */
ON.conns={};ON.peer=null;ON.conn=null;ON.joined=false;
const net=()=>typeof Peer!=='undefined';
const fail=m=>{cleanup();S.err=m;go('onhome',{err:m})};
function readName(){const v=document.getElementById('nm').value.trim();if(!v){S.err='Enter your name first';render();return null}ON.name=v;return v}
function cleanup(){const p=ON.peer;if(p)setTimeout(()=>p.destroy(),400);ON.peer=null;ON.conn=null;ON.conns={};ON.game=null;ON.players=[];ON.code='';ON.joined=false;lastPhase=''}
function kickedOut(m){cleanup();go('onhome',{err:m})}
let lastPhase='';
function onSet(o){if(!ON.game||ON.game.host!==ON.id)return;Object.assign(ON.game,o);bcast()}
function bcast(){const m={t:'state',g:ON.game,p:ON.players};Object.values(ON.conns).forEach(c=>c.open&&c.send(m));tick()}
function onCreate(){const n=readName();if(!n)return;if(!net())return fail('Online play needs an internet connection.');
const L='ABCDEFGHJKMNPQRSTUVWXYZ';ON.code=Array.from({length:4},()=>pick(L)).join('');
const peer=ON.peer=new Peer('imposter-'+ON.code);let open=false;
peer.on('error',e=>{if(open)return;if(e.type==='unavailable-id'){peer.destroy();ON.peer=null;return onCreate()}fail('Couldn’t create a lobby. Check your connection.')});
peer.on('open',()=>{open=true;ON.conns={};ON.players=[{id:ON.id,name:n,vote:null,t:Date.now()}];ON.game={host:ON.id,phase:'lobby',round:0,cfg:cfgOf(),bans:[]};go('online');bcast()});
peer.on('connection',c=>{c.on('data',m=>hostMsg(c,m));c.on('close',()=>drop(c))})}
function hostMsg(c,m){const g=ON.game;if(!m||!g)return;
if(m.t==='join'){const nm=String(m.name||'').trim().slice(0,14),low=nm.toLowerCase(),rej=(t)=>{c.send({t});setTimeout(()=>c.close(),300)};
if(!nm)return c.close();if((g.bans||[]).includes(low))return rej('banned');if(g.phase!=='lobby')return rej('late');
if(ON.players.length>=12)return rej('full');if(ON.players.some(p=>p.name.toLowerCase()===low))return rej('dup');
c.pid=m.id;ON.conns[m.id]=c;ON.players.push({id:m.id,name:nm,vote:null,t:Date.now()});bcast()}
else if(m.t==='vote'&&g.phase==='vote'){const p=ON.players.find(x=>x.id===c.pid);if(p&&ON.players.some(x=>x.id===m.to)){p.vote={r:g.round,to:m.to};bcast()}}
else if(m.t==='guess'&&g.phase==='guess'&&c.pid===g.caught)onSet({phase:'result',guess:String(m.text||'—').slice(0,40)})}
function drop(c){if(!c.pid||!ON.conns[c.pid])return;delete ON.conns[c.pid];ON.players=ON.players.filter(p=>p.id!==c.pid);bcast()}
function onJoin(){const n=readName();if(!n)return;if(!net())return fail('Online play needs an internet connection.');
const c=document.getElementById('cd').value.trim().toUpperCase();if(c.length<4){S.err='Enter the 4-letter code';return render()}
ON.code=c;const peer=ON.peer=new Peer();
const to=setTimeout(()=>{if(!ON.joined)fail('Couldn’t reach that lobby.')},12000);
peer.on('error',e=>{if(!ON.joined){clearTimeout(to);fail(e.type==='peer-unavailable'?'No lobby with that code':'Couldn’t join that lobby.')}});
peer.on('open',()=>{const conn=ON.conn=peer.connect('imposter-'+c,{reliable:true});
conn.on('open',()=>conn.send({t:'join',id:ON.id,name:n}));
conn.on('data',m=>{if(!m)return;
if(m.t==='state'){clearTimeout(to);ON.game=m.g;ON.players=m.p;if(!ON.joined){ON.joined=true;go('online')}tick()}
else if(m.t==='kick')kickedOut(m.ban?'You were banned from that lobby':'You were removed from the lobby');
else if(m.t==='closed')kickedOut('The host closed the lobby');
else{clearTimeout(to);const msg={banned:'You’ve been banned from this lobby',late:'That game has already started',full:'That lobby is full',dup:'Someone in that lobby already has that name'}[m.t];if(msg)fail(msg)}});
conn.on('close',()=>{if(ON.joined)kickedOut('Lost connection to the host')})})}
function tick(){const g=ON.game;if(!g)return;if(g.phase!==lastPhase+g.round){S.peek=false;lastPhase=g.phase+g.round}
if(g.phase==='vote'&&g.host===ON.id&&ON.players.length&&ON.players.every(p=>p.vote&&p.vote.r===g.round)){const c=tally().caught;onSet(g.gOn&&c?{phase:'guess',caught:c}:{phase:'result'})}
if(S.screen==='online')render()}
function onVote(to){const g=ON.game;if(g.host===ON.id){const me=ON.players.find(p=>p.id===ON.id);if(g.phase==='vote'&&me){me.vote={r:g.round,to};bcast()}}else if(ON.conn)ON.conn.send({t:'vote',to})}
function onGuess(){const v=document.getElementById('gs').value.trim()||'—';if(ON.game.host===ON.id)onSet({phase:'result',guess:v});else if(ON.conn)ON.conn.send({t:'guess',text:v})}
function removeP(id,ban){const c=ON.conns[id],p=ON.players.find(x=>x.id===id);if(!p)return;if(ban)ON.game.bans=[...(ON.game.bans||[]),p.name.toLowerCase()];
ON.players=ON.players.filter(x=>x.id!==id);delete ON.conns[id];if(c){c.send({t:'kick',ban:!!ban});setTimeout(()=>c.close(),300)}bcast()}
function onKick(id){removeP(id,0)}
function onBan(id){removeP(id,1)}
function onLeave(){if(ON.game&&ON.game.host===ON.id)Object.values(ON.conns).forEach(c=>c.open&&c.send({t:'closed'}));cleanup();go('onhome')}
function onStart(){const P=ON.players,d=draw(),ids=P.map(p=>p.id).sort(()=>Math.random()-.5);onSet({phase:'role',round:(ON.game.round||0)+1,cat:d.cat,word:d.word,imps:ids.slice(0,nImps(P.length)),start:pick(P).id,timer:ST.timer,gOn:ST.guess,guess:'',caught:null,endsAt:0})}
function onDisc(){ON._adv=0;onSet({phase:'discuss',endsAt:ON.game.timer?Date.now()+ON.game.timer*1000:0})}
const cfgOf=()=>({timer:ST.timer,imps:ST.imps,guess:ST.guess,packs:[...ST.packs]});
function cfgSync(){const g=ON.game;if(g&&g.host===ON.id&&g.phase==='lobby')onSet({cfg:cfgOf()})}
const cfgView=(c,n)=>{c=c||{};return`<div class="card"><div class="lbl" style="margin-bottom:12px">Host settings</div><div class="set"><span>Discussion timer</span><b>${fmt(c.timer||0)}</b></div><div class="set"><span>Imposters</span><b>${Math.min(c.imps||1,maxImps(n))}</b></div><div class="set"><span>Imposter guess</span><b>${c.guess?'On':'Off'}</b></div><div style="color:var(--mu);font-size:13px;margin:4px 0 8px">Word packs</div>${(c.packs||[]).map(x=>`<span class="pk on">${esc(x)}</span>`).join('')}</div>`};
const pCtl=(p,host)=>host&&p.id!==ON.id?`<span><button class="mini" onclick="onKick('${p.id}')">Kick</button><button class="mini bn" onclick="onBan('${p.id}')">Ban</button></span>`:'';
function tally(){const g=ON.game,t={};ON.players.filter(p=>p.vote&&p.vote.r===g.round).forEach(p=>t[p.vote.to]=(t[p.vote.to]||0)+1);const mx=Math.max(0,...Object.values(t)),top=Object.keys(t).filter(k=>t[k]===mx);return{t,top,caught:top.length===1&&g.imps.includes(top[0])?top[0]:null}}
setInterval(()=>{const el=document.getElementById('tm');if(!el)return;const end=S.screen==='ppdiscuss'?PP.end:(ON.game&&ON.game.endsAt);if(!end)return;const l=Math.max(0,Math.ceil((end-Date.now())/1000));el.textContent=l?Math.floor(l/60)+':'+String(l%60).padStart(2,'0'):'Time’s up!';el.classList.toggle('up',!l);
if(!l&&S.screen==='online'&&ON.game.phase==='discuss'&&ON.game.host===ON.id&&!ON._adv){ON._adv=1;onSet({phase:'vote'})}},500);
/* ---------- init ---------- */
render();
</script></body></html>
