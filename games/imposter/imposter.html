*{box-sizing:border-box}

p.sub{color:var(--mu);margin:0 0 24px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}

button:hover{border-color:#44445e}button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;box-shadow:0 8px 24px -8px var(--ac)}

input:focus,select:focus{border-color:var(--ac)}
input.code{text-align:center;letter-spacing:10px;font-size:26px;font-weight:700;text-transform:uppercase}
.row{display:flex;gap:10px}.row>*{flex:1}
.chip{display:flex;justify-content:space-between;align-items:center;background:#0e0e16;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;animation:in .25s}
.chip small{color:var(--mu)}.x{cursor:pointer;color:var(--mu);padding:0 4px}
.big{font-size:54px;font-weight:800;text-align:center;letter-spacing:-1px;margin:18px 0;line-height:1.1}
.role{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.role .lbl{color:var(--mu);font-size:13px;letter-spacing:2px;text-transform:uppercase}
.imp{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.code-show{font-size:48px;font-weight:800;letter-spacing:12px;text-align:center;margin:6px 0 14px;padding-left:12px}

.back{background:none;border:0;color:var(--mu);width:auto;padding:6px 0;margin:0 0 10px}
.err{color:var(--ac);font-size:14px;min-height:20px;margin-bottom:6px}
.sel{border-color:var(--ac)!important;background:#2a1220}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:8px}

${(S.rooms||[]).map(roomCard).join('')}${S.scanning?'<p class="sub" style="text-align:center">Searching…</p>':(S.rooms||[]).length?'':'<div class="card"><p class="sub" style="margin:0;text-align:center">No public rooms right now.</p></div>'}

online:()=>{const g=ON.game,P=ON.players,host=g&&g.host===ON.id,me=P.find(p=>p.id===ON.id);if(!g)return'<p class="sub">Connecting…</p>';
const hdr=`<div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl sub" style="font-size:13px">LOBBY ${ON.code}</span><button class="back" onclick="onLeave()">Leave</button></div>`;
if(g.phase==='lobby')return hdr+`<p class="sub" style="text-align:center;margin:10px 0 0">Share this code</p><div class="code-show">${ON.code}</div>
<div class="card">${P.map(p=>`<div class="chip"><span><span class="dot"></span>${esc(p.name)}${p.id===g.host?' <small>host</small>':''}${p.id===ON.id?' <small>you</small>':''}</span>${pCtl(p,host)}</div>`).join('')}</div>
${host?`${settings()}<button class="pri" ${P.length<3?'disabled':''} onclick="onStart()">${P.length<3?'Need 3+ players':'Start game'}</button>`:`${cfgView(g.cfg,P.length)}<p class="sub" style="text-align:center">Waiting for the host to start…</p>`}`;

<p class="sub" style="text-align:center">${P.filter(p=>p.seen===g.round).length} of ${P.length} have viewed their role</p>${host?`<button class="pri" ${P.every(p=>p.seen===g.round)?'':'disabled'} onclick="onDisc()">Start discussion</button>`:'<p class="sub" style="text-align:center">Waiting for host to begin discussion…</p>'}`;
if(g.phase==='discuss')return hdr+`<div style="text-align:center;margin-top:20px"><h2>Discussion</h2><p class="sub"><b style="color:var(--tx)">${esc(nameOf(g.start))}</b> goes first. One clue each, then vote.</p></div>
<div class="card role" style="min-height:110px" onclick="S.peek=!S.peek;render()">${S.peek?(imp&&!g.blind?'<div class="big imp" style="font-size:30px;margin:0">IMPOSTER</div>':`<div class="big" style="font-size:30px;margin:0">${esc(imp?g.dword:g.word)}</div>`):'<span class="lbl">Tap to peek at your secret</span>'}</div>
${g.endsAt?'<div class="tm" id="tm"></div>':''}${host?`<button class="pri" onclick="onSet({phase:'vote'})">Call the vote</button>`:'<p class="sub" style="text-align:center">Host will call the vote…</p>'}${chatBox()}`;
const votes=P.filter(p=>p.vote&&p.vote.r===g.round);
if(g.phase==='guess')return hdr+(g.caught===ON.id?`<h2>You were caught!</h2><p class="sub">Guess the secret word to steal the win.</p><input id="gs" placeholder="Your guess" autofocus onkeydown="if(event.key==='Enter')onGuess()"><button class="pri" onclick="onGuess()">Submit guess</button>`:`<div style="text-align:center;margin-top:40px"><h2>${esc(nameOf(g.caught))} was caught</h2><p class="sub">They’re guessing the word…</p></div>`);
if(g.phase==='vote')return hdr+`<h2>Who’s the imposter?</h2><p class="sub">${votes.length} of ${P.length} voted</p><div class="bar"><i style="width:${votes.length/P.length*100}%"></i></div><div style="height:16px"></div>
${P.filter(p=>p.id!==ON.id).map(p=>`<button class="${me&&me.vote&&me.vote.r===g.round&&me.vote.to===p.id?'sel':''}" onclick="onVote('${p.id}')">${esc(p.name)}</button>`).join('')}`;
const {t,caught}=tally();const win=caught&&!(g.guess&&g.guess.trim().toLowerCase()===String(g.word).toLowerCase());
return hdr+`<div style="text-align:center;margin-top:10px"><p class="sub">The imposter${g.imps.length>1?'s were':' was'}</p><div class="big imp" style="font-size:${g.imps.length>1?34:54}px">${g.imps.map(i=>esc(nameOf(i))).join(' &amp; ')}</div><p class="sub">Word: <b style="color:var(--tx)">${esc(g.word)}</b></p>${g.blind?`<p class="sub">Imposter’s word: <b style="color:var(--tx)">${esc(g.dword)}</b></p>`:''}
<div class="card" style="color:${win?'var(--ok)':'var(--ac)'};font-weight:700">${win?'Caught! Crew wins 🎉':(caught?'Imposter steals the win 😈':'Escaped! Imposter wins 😈')}${g.guess?`<div style="font-size:14px;color:var(--mu);font-weight:400;margin-top:6px">Imposter guessed “${esc(g.guess)}”</div>`:''}</div></div>
<div class="card">${P.map(p=>`<div class="chip"><span>${esc(p.name)}</span><span style="display:flex;align-items:center"><small>${t[p.id]||0} vote${(t[p.id]||0)===1?'':'s'}</small>${pCtl(p,host)}</span></div>`).join('')}</div>
${host?`<button class="pri" onclick="onStart()">Play again</button><button onclick="onLobby()">Back to lobby</button>`:'<p class="sub" style="text-align:center">Waiting for host…</p>'}`}
};
const nameOf=id=>(ON.players.find(p=>p.id===id)||{name:'?'}).name;
/* ---------- pass & play logic ---------- */
function addName(){const el=document.getElementById('nm'),v=el.value.trim();if(!v)return;if(S.names.length>=12){S.err='Max 12 players';return render()}
if(S.names.some(n=>n.toLowerCase()===v.toLowerCase())){S.err='That name is taken';return render()}S.names.push(v);S.err='';render()}
function ppStart(){const d=draw(),n=S.names.length,idx=[...Array(n).keys()].sort(()=>Math.random()-.5);PP={...d,i:0,imps:idx.slice(0,nImps(n)),start:Math.floor(Math.random()*n),blind:ST.blind,hints:ST.hints,guess:ST.guess&&!ST.blind};go('pppass',{gdone:false,gres:''})}
function ppRes(){const im=PP.imps.map(i=>esc(S.names[i])).join(' &amp; '),multi=PP.imps.length>1;
return`<div style="text-align:center;margin-top:30px"><p class="sub">The imposter${multi?'s were':' was'}</p><div class="big imp" style="font-size:${multi?34:54}px">${im}</div>
${PP.guess&&!S.gdone?`<div class="card" style="text-align:left"><p class="sub" style="margin:0 0 12px">If caught, the imposter gets one guess at the word.</p><input id="gs" placeholder="Imposter’s guess" autofocus onkeydown="if(event.key==='Enter')ppGuess()"><button class="pri" style="margin:0" onclick="ppGuess()">Submit guess</button><button class="ghost" style="margin:8px 0 0" onclick="ppGuess(1)">Skip</button></div>`:`${S.gres?`<p style="font-weight:700;color:${S.gres==='ok'?'var(--ac)':'var(--ok)'}">${S.gres==='ok'?'Correct guess — the imposter steals the win!':'Wrong guess — the crew wins!'}</p>`:''}<p class="sub">The word was</p><div class="big" style="font-size:38px">${esc(PP.word)}</div>${PP.blind?`<p class="sub">Imposter’s word was <b style="color:var(--tx)">${esc(PP.dword)}</b></p>`:''}`}</div>`}
function ppGuess(skip){let r='';if(!skip){const v=(document.getElementById('gs').value||'').trim().toLowerCase();r=v===PP.word.toLowerCase()?'ok':'no'}S.gdone=true;S.gres=r;render()}
function ppNext(){PP.i++;if(PP.i>=S.names.length)PP.end=ST.timer?Date.now()+ST.timer*1000:0;go(PP.i<S.names.length?'pppass':'ppdiscuss')}
/* ---------- online (peer-to-peer) ---------- */
ON.chat=[];ON.typAt={};ON.typers=[];ON.conns={};ON.peer=null;ON.conn=null;ON.joined=false;
const net=()=>typeof Peer!=='undefined';
const fail=m=>{cleanup();S.err=m;go('onhome',{err:m})};
function readName(){const v=document.getElementById('nm').value.trim();if(!v){S.err='Enter your name first';render();return null}ON.name=v;return v}
function cleanup(){ON.chat=[];ON.typers=[];ON.typAt={};S.draft='';closePub();ST.pub=false;const p=ON.peer;if(p)setTimeout(()=>p.destroy(),400);ON.peer=null;ON.conn=null;ON.conns={};ON.game=null;ON.players=[];ON.code='';ON.joined=false;lastPhase=''}
function kickedOut(m){cleanup();go('onhome',{err:m})}
let lastPhase='';
function onSet(o){if(!ON.game||ON.game.host!==ON.id)return;Object.assign(ON.game,o);bcast()}
function bcast(){const m={t:'state',g:ON.game,p:ON.players,c:ON.chat};Object.values(ON.conns).forEach(c=>c.open&&c.send(m));tick()}
function onCreate(){const n=readName();if(!n)return;if(!net())return fail('Online play needs an internet connection.');
ST.pub=false;ON.pubNote='';ON.wantPub=false;const L='ABCDEFGHJKMNPQRSTUVWXYZ';ON.code=Array.from({length:4},()=>pick(L)).join('');
const peer=ON.peer=new Peer('imposter-'+ON.code);let open=false;
peer.on('error',e=>{if(open)return;if(e.type==='unavailable-id'){peer.destroy();ON.peer=null;return onCreate()}fail('Couldn’t create a lobby. Check your connection.')});
peer.on('open',()=>{open=true;ON.conns={};ON.players=[{id:ON.id,name:n,vote:null,t:Date.now()}];ON.game={host:ON.id,phase:'lobby',round:0,cfg:cfgOf(),bans:[]};go('online');bcast()});
peer.on('connection',c=>{c.on('data',m=>hostMsg(c,m));c.on('close',()=>drop(c))})}
function hostMsg(c,m){const g=ON.game;if(!m||!g)return;
if(m.t==='info'){const h=ON.players.find(p=>p.id===g.host)||{name:'?'};c.send({t:'info',host:h.name,n:ON.players.length,max:12,cfg:g.cfg,phase:g.phase});setTimeout(()=>c.close(),300);return}
if(m.t==='join'){const nm=String(m.name||'').trim().slice(0,14),low=nm.toLowerCase(),rej=(t)=>{c.send({t});setTimeout(()=>c.close(),300)};
if(!nm)return c.close();if((g.bans||[]).includes(low))return rej('banned');if(g.phase!=='lobby')return rej('late');
if(ON.players.length>=12)return rej('full');if(ON.players.some(p=>p.name.toLowerCase()===low))return rej('dup');
c.pid=m.id;ON.conns[m.id]=c;ON.players.push({id:m.id,name:nm,vote:null,t:Date.now()});bcast()}
else if(m.t==='seen'&&g.phase==='role'){const p=ON.players.find(x=>x.id===c.pid);if(p){p.seen=g.round;bcast()}}
else if(m.t==='typing'&&g.phase==='discuss'){ON.typAt[c.pid]=Date.now();pushTyping()}
else if(m.t==='chat'&&g.phase==='discuss')addChat(c.pid,String(m.text||'').trim());
else if(m.t==='vote'&&g.phase==='vote'){const p=ON.players.find(x=>x.id===c.pid);if(p&&ON.players.some(x=>x.id===m.to)){p.vote={r:g.round,to:m.to};bcast()}}
else if(m.t==='guess'&&g.phase==='guess'&&c.pid===g.caught)onSet({phase:'result',guess:String(m.text||'—').slice(0,40)})}
function drop(c){if(!c.pid||!ON.conns[c.pid])return;delete ON.conns[c.pid];ON.players=ON.players.filter(p=>p.id!==c.pid);bcast()}
function onJoin(){const n=readName();if(!n)return;const c=document.getElementById('cd').value.trim().toUpperCase();if(c.length<3){S.err='Enter the lobby code';return render()}joinWith(c,n)}
function joinCode(c){joinWith(c,ON.name)}
function joinWith(c,n){if(!net())return fail('Online play needs an internet connection.');
ON.code=c;const peer=ON.peer=new Peer();
const to=setTimeout(()=>{if(!ON.joined)fail('Couldn’t reach that lobby.')},12000);
peer.on('error',e=>{if(!ON.joined){clearTimeout(to);fail(e.type==='peer-unavailable'?'No lobby with that code':'Couldn’t join that lobby.')}});
peer.on('open',()=>{const conn=ON.conn=peer.connect('imposter-'+c,{reliable:true});
conn.on('open',()=>conn.send({t:'join',id:ON.id,name:n}));
conn.on('data',m=>{if(!m)return;
if(m.t==='state'){clearTimeout(to);ON.game=m.g;ON.players=m.p;ON.chat=m.c||[];if(!ON.joined){ON.joined=true;go('online')}tick()}
else if(m.t==='typ'){ON.typers=m.n||[];showTyping()}
else if(m.t==='kick')kickedOut(m.ban?'You were banned from that lobby':'You were removed from the lobby');
else if(m.t==='closed')kickedOut('The host closed the lobby');
else{clearTimeout(to);const msg={banned:'You’ve been banned from this lobby',late:'That game has already started',full:'That lobby is full',dup:'Someone in that lobby already has that name'}[m.t];if(msg)fail(msg)}});
conn.on('close',()=>{if(ON.joined)kickedOut('Lost connection to the host')})})}
function tick(){const g=ON.game;if(!g)return;if(g.phase!==lastPhase+g.round){S.peek=false;lastPhase=g.phase+g.round}
if(g.phase==='vote'&&g.host===ON.id&&ON.players.length&&ON.players.every(p=>p.vote&&p.vote.r===g.round)){const c=tally().caught;onSet(g.gOn&&c?{phase:'guess',caught:c}:{phase:'result'})}
if(S.screen==='online')render()}
function onVote(to){const g=ON.game;if(g.host===ON.id){const me=ON.players.find(p=>p.id===ON.id);if(g.phase==='vote'&&me){me.vote={r:g.round,to};bcast()}}else if(ON.conn)ON.conn.send({t:'vote',to})}
function onGuess(){const v=document.getElementById('gs').value.trim()||'—';if(ON.game.host===ON.id)onSet({phase:'result',guess:v});else if(ON.conn)ON.conn.send({t:'guess',text:v})}
function removeP(id,ban){const c=ON.conns[id],p=ON.players.find(x=>x.id===id);if(!p)return;if(ban)ON.game.bans=[...(ON.game.bans||[]),p.name.toLowerCase()];
ON.players=ON.players.filter(x=>x.id!==id);delete ON.conns[id];if(c){c.send({t:'kick',ban:!!ban});setTimeout(()=>c.close(),300)}bcast()}
const PUB_N=30,pad=n=>String(n).padStart(2,'0');
function closePub(){const p=ON.pubPeer;if(p)setTimeout(()=>p.destroy(),200);ON.pubPeer=null}
function tryPub(i){if(i>PUB_N){ST.pub=false;ON.pubNote='Public rooms are full right now';return render()}
const p=new Peer('imposter-P'+pad(i));
p.on('error',e=>{if(e.type==='unavailable-id'){p.destroy();return tryPub(i+1)}if(ON.pubPeer!==p){p.destroy();ST.pub=false;ON.pubNote='Couldn’t list the room';render()}});
p.on('open',()=>{if(!ON.wantPub||!ON.game){p.destroy();return}ON.pubPeer=p;ON.pubNote='';cfgSync();render()});
p.on('connection',c=>{c.on('data',m=>hostMsg(c,m));c.on('close',()=>drop(c))})}
function setPub(on){if(!ON.game||ON.game.host!==ON.id)return;ON.wantPub=on;ST.pub=on;closePub();
if(!on){ON.pubNote='';cfgSync();return render()}if(!net()){ST.pub=false;ON.pubNote='Online play needs an internet connection.';return render()}ON.pubNote='Listing…';cfgSync();tryPub(1);render()}
function roomCard(r){const c=r.cfg||{},full=r.n>=r.max;return`<div class="card"><div class="set" style="margin-bottom:10px"><b style="font-size:17px">${esc(r.host)}’s room</b><button class="pri" style="width:auto;margin:0;padding:10px 20px" ${full?'disabled':''} onclick="joinCode('${r.code}')">${full?'Full':'Join'}</button></div>
<div style="color:var(--mu);font-size:13px;line-height:1.8">👥 ${r.n}/${r.max} players · ⏱ Timer ${fmt(c.timer||0)} · ${c.imps||1} imposter${(c.imps||1)>1?'s':''}<br>${DIFFS[c.diff==null?1:c.diff]} · ${c.blind?'Blind':'Classic'} mode · Hints ${c.hints===false?'off':'on'} · Guess ${c.guess&&!c.blind?'on':'off'}<br>${(c.packs||[]).map(esc).join(', ')}</div></div>`}
function onSearch(again){if(!again){const n=readName();if(!n)return}
if(!net())return fail('Online play needs an internet connection.');
go('search',{rooms:[],scanning:true});const peer=new Peer(),rooms=[];let done=false;
const finish=()=>{if(done)return;done=true;try{peer.destroy()}catch(e){}if(S.screen==='search'){S.scanning=false;render()}};
peer.on('error',()=>{});
peer.on('open',()=>{for(let i=1;i<=PUB_N;i++){const code='P'+pad(i),conn=peer.connect('imposter-'+code);
conn.on('open',()=>conn.send({t:'info'}));
conn.on('data',m=>{if(m&&m.t==='info'&&m.phase==='lobby'){rooms.push({...m,code});rooms.sort((a,b)=>a.code<b.code?-1:1);S.rooms=[...rooms];if(S.screen==='search')render()}})}
setTimeout(finish,5000)});
setTimeout(finish,12000)}
function togPeek(){S.peek=!S.peek;const g=ON.game;if(S.peek&&g.phase==='role'){if(g.host===ON.id){const me=ON.players.find(p=>p.id===ON.id);if(me){me.seen=g.round;bcast();return}}else if(ON.conn)ON.conn.send({t:'seen'})}render()}
function addChat(id,x){const p=ON.players.find(q=>q.id===id);if(!p||!x)return;ON.typAt[id]=0;ON.chat.push({id,n:p.name,x:x.slice(0,200)});if(ON.chat.length>100)ON.chat.shift();bcast();pushTyping()}
function onChat(){const el=document.getElementById('ci'),v=(el?el.value:'').trim();if(!v)return;S.draft='';if(ON.game.host===ON.id)addChat(ON.id,v);else if(ON.conn)ON.conn.send({t:'chat',text:v});render();const e=document.getElementById('ci');if(e)e.focus()}
const chatBox=()=>`<div class="card" style="margin-top:14px"><div class="lbl" style="margin-bottom:10px">Chat</div><div id="cl" class="chatlog">${ON.chat.length?ON.chat.map(m=>`<div class="msg ${m.id===ON.id?'me':''}"><b>${esc(m.n)}</b>${esc(m.x)}</div>`).join(''):'<p class="sub" style="margin:0 0 4px;font-size:13px">No messages yet. Don’t say the word outright!</p>'}</div><div id="ty" style="height:18px;color:var(--mu);font-size:12px;margin:-4px 0 6px">${typText()}</div><div class="row"><input id="ci" placeholder="Discuss the word…" maxlength="200" autocomplete="off" value="${esc(S.draft||'')}" oninput="S.draft=this.value;onTyping()" onkeydown="if(event.key==='Enter')onChat()"><button style="flex:0 0 76px;margin:0 0 10px" onclick="onChat()">Send</button></div></div>`;
const typText=()=>{const n=ON.typers||[];return n.length?(n.length===1?n[0]+' is typing…':n.length===2?n.join(' and ')+' are typing…':'Several people are typing…'):''};
const showTyping=()=>{const el=document.getElementById('ty');if(el)el.textContent=typText()};
const typList=ex=>{const now=Date.now();return ON.players.filter(p=>p.id!==ex&&now-(ON.typAt[p.id]||0)<3000).map(p=>p.name)};
function pushTyping(){if(!ON.game||ON.game.host!==ON.id)return;const mine=typList(ON.id);if(JSON.stringify(mine)!==JSON.stringify(ON.typers)){ON.typers=mine;showTyping()}
Object.entries(ON.conns).forEach(([id,c])=>{const l=JSON.stringify(typList(id));if(c.open&&l!==c._tl){c._tl=l;c.send({t:'typ',n:typList(id)})}})}
setInterval(pushTyping,800);
function onTyping(){const now=Date.now();if(now-(ON._ts||0)<1500)return;ON._ts=now;const g=ON.game;if(!g)return;if(g.host===ON.id){ON.typAt[ON.id]=now;pushTyping()}else if(ON.conn)ON.conn.send({t:'typing'})}
function onLobby(){if(!ON.game||ON.game.host!==ON.id)return;ON.chat=[];ON.players.forEach(p=>{p.vote=null;p.seen=null});onSet({phase:'lobby',guess:'',caught:null,endsAt:0,cfg:cfgOf()})}
function onKick(id){removeP(id,0)}
function onBan(id){removeP(id,1)}
function onLeave(){if(ON.game&&ON.game.host===ON.id)Object.values(ON.conns).forEach(c=>c.open&&c.send({t:'closed'}));cleanup();go('onhome')}
function onStart(){ON.chat=[];const P=ON.players,d=draw(),ids=P.map(p=>p.id).sort(()=>Math.random()-.5);onSet({phase:'role',round:(ON.game.round||0)+1,cat:d.cat,word:d.word,imps:ids.slice(0,nImps(P.length)),start:pick(P).id,timer:ST.timer,gOn:ST.guess&&!ST.blind,blind:ST.blind,hints:ST.hints,dword:d.dword,guess:'',caught:null,endsAt:0})}
function onDisc(){if(!ON.players.every(p=>p.seen===ON.game.round))return;ON._adv=0;onSet({phase:'discuss',endsAt:ON.game.timer?Date.now()+ON.game.timer*1000:0})}
const cfgOf=()=>({diff:ST.diff,timer:ST.timer,imps:ST.imps,guess:ST.guess,blind:ST.blind,hints:ST.hints,pub:ST.pub,packs:[...ST.packs]});
function cfgSync(){const g=ON.game;if(g&&g.host===ON.id&&g.phase==='lobby')onSet({cfg:cfgOf()})}
const cfgView=(c,n)=>{c=c||{};return`<div class="card"><div class="lbl" style="margin-bottom:12px">Host settings</div><div class="set"><span>Discussion timer</span><b>${fmt(c.timer||0)}</b></div><div class="set"><span>Imposters</span><b>${Math.min(c.imps||1,maxImps(n))}</b></div><div class="set"><span>Imposter guess</span><b>${c.guess&&!c.blind?'On':'Off'}</b></div><div class="set"><span>Difficulty</span><b>${DIFFS[c.diff==null?1:c.diff]}</b></div><div class="set"><span>Game mode</span><b>${c.blind?'Blind':'Classic'}</b></div><div class="set"><span>Hints</span><b>${c.hints===false?'Off':'On'}</b></div><div class="set"><span>Room</span><b>${c.pub?'Public':'Private'}</b></div><div style="color:var(--mu);font-size:13px;margin:4px 0 8px">Word packs</div>${(c.packs||[]).map(x=>`<span class="pk on">${esc(x)}</span>`).join('')}</div>`};
const pCtl=(p,host)=>host&&p.id!==ON.id?`<span><button class="mini" onclick="onKick('${p.id}')">Kick</button><button class="mini bn" onclick="onBan('${p.id}')">Ban</button></span>`:'';
function tally(){const g=ON.game,t={};ON.players.filter(p=>p.vote&&p.vote.r===g.round).forEach(p=>t[p.vote.to]=(t[p.vote.to]||0)+1);const mx=Math.max(0,...Object.values(t)),top=Object.keys(t).filter(k=>t[k]===mx);return{t,top,caught:top.length===1&&g.imps.includes(top[0])?top[0]:null}}
setInterval(()=>{const el=document.getElementById('tm');if(!el)return;const end=S.screen==='ppdiscuss'?PP.end:(ON.game&&ON.game.endsAt);if(!end)return;const l=Math.max(0,Math.ceil((end-Date.now())/1000));el.textContent=l?Math.floor(l/60)+':'+String(l%60).padStart(2,'0'):'Time’s up!';el.classList.toggle('up',!l);
if(!l&&S.screen==='online'&&ON.game.phase==='discuss'&&ON.game.host===ON.id&&!ON._adv){ON._adv=1;onSet({phase:'vote'})}},500);
/* ---------- init ---------- */
render();
</script></body></html>
