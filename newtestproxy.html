<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapid Proxy Loader</title>
<style>
  body {
    margin: 0;
    background: #2b2b2b;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  #iframe-container {
    position: relative;
    flex-grow: 1;
    width: 100%;
    height: 100%;
  }

  #proxy-frame {
    width: 100%;
    height: 100%;
    border: none;
  }

  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(43,43,43,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    font-size: 2rem;
    font-weight: bold;
  }

  #progress-container {
    width: 60%;
    height: 16px;
    background: #404040;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 20px;
    box-shadow: inset 0 0 6px #1a73e8aa;
  }

  #progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #1a73e8, #4da6ff);
    border-radius: 8px 0 0 8px;
    transition: width 0.1s linear;
  }

  /* Custom modal */
  #modal {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #2b2b2b;
    border: 2px solid #4da6ff;
    border-radius: 12px;
    padding: 30px;
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-width: 300px;
  }

  #modal h2 {
    margin-bottom: 20px;
    font-size: 1.5rem;
  }

  .modal-btn {
    margin: 0 10px;
    padding: 10px 20px;
    background: #1a73e8;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.3s;
  }

  .modal-btn:hover {
    background: #4da6ff;
  }

  .modal-btn-container {
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div id="iframe-container">
  <iframe id="proxy-frame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

  <div id="overlay">
    Loading...
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
  </div>

  <div id="modal">
    <h2>Did this load?</h2>
    <div class="modal-btn-container">
      <button class="modal-btn" id="yes-btn">Yes</button>
      <button class="modal-btn" id="no-btn">No</button>
    </div>
  </div>
</div>

<script>
const proxy = 'https://scramjet.mercurywork.shop/'; // replace with your proxy
const iframe = document.getElementById('proxy-frame');
const overlay = document.getElementById('overlay');
const progressBar = document.getElementById('progress-bar');
const modal = document.getElementById('modal');
const yesBtn = document.getElementById('yes-btn');
const noBtn = document.getElementById('no-btn');
let intervalId;

function startRapidLoad() {
  let startTime = Date.now();
  overlay.style.display = 'flex';
  progressBar.style.width = '0%';
  modal.style.display = 'none';

  intervalId = setInterval(() => {
    iframe.src = proxy + '?t=' + Date.now();

    let elapsed = Date.now() - startTime;
    let progress = Math.min((elapsed / 5000) * 100, 100);
    progressBar.style.width = progress + '%';

    if (elapsed >= 5000) {
      clearInterval(intervalId);
      setTimeout(showModal, 500);
    }
  }, 200);
}

function showModal() {
  modal.style.display = 'flex';
}

yesBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
  modal.style.display = 'none';
});

noBtn.addEventListener('click', () => {
  modal.style.display = 'none';
  startRapidLoad();
});

// Start automatically
startRapidLoad();
</script>

</body>
</html>
