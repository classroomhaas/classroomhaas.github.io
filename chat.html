<!DOCTYPE html>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
       
        .app-container { width: 100%; max-width: 500px; height: 100%; max-height: 800px; background: var(--panel); display: flex; flex-direction: column; position: relative; border-left: 1px solid #334155; border-right: 1px solid #334155; }
       
        /* --- 1. GATEKEEPER SCREEN --- */
        #gatekeeper-screen { position: absolute; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        
        /* --- 2. LOGIN SCREEN --- */
        #login-screen { position: absolute; inset: 0; background: var(--panel); z-index: 50; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        
        h1 { color: var(--accent); margin-bottom: 20px; text-align: center; }
        h2 { color: white; margin-bottom: 10px; text-align: center; font-size: 18px; }
        
        input { background: var(--bg); border: 1px solid #334155; color: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--accent); }
        button { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button.secondary { background: #334155; margin-top: 10px; }

        /* --- FEATURED SPACES UI --- */
        .featured-spaces { margin-top: 20px; text-align: center; }
        .featured-spaces p { color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
        .space-tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .space-tag { background: #334155; color: #cbd5e1; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .space-tag:hover { background: var(--bg); border-color: var(--accent); color: white; }
       
        /* Chat UI */
        header { padding: 15px; border-bottom: 1px solid #334155; background: rgba(15, 23, 42, 0.5); display: flex; justify-content: space-between; align-items: center; }
        #status { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; background: #64748b; border-radius: 50%; }
        .dot.green { background: #4ade80; }
        .dot.orange { background: #facc15; }
        .dot.red { background: #ef4444; }
       
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .msg-row { display: flex; flex-direction: column; max-width: 85%; }
        .msg-row.sent { align-self: flex-end; align-items: flex-end; }
        .msg-row.recv { align-self: flex-start; align-items: flex-start; }
       
        .bubble { padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .sent .bubble { background: var(--accent); color: white; border-bottom-right-radius: 2px; }
        .recv .bubble { background: #334155; color: white; border-bottom-left-radius: 2px; }
       
        .sender-name { font-size: 11px; color: #94a3b8; margin-bottom: 4px; margin-left: 2px; }
       
        footer { padding: 15px; background: var(--panel); border-top: 1px solid #334155; display: flex; gap: 10px; }
       
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

<div class="app-container">

    <div id="gatekeeper-screen">
        <h1>Private Access</h1>
        <p style="color:#94a3b8; text-align:center; margin-bottom:20px;">Enter the site password to continue.</p>
        <input type="password" id="site-password" placeholder="Password">
        <button onclick="checkSitePassword()">Unlock</button>
    </div>

    <div id="login-screen">
        <h1>Global Chat</h1>
        <p style="color:#94a3b8; text-align:center; margin-bottom:20px;">Join a Room</p>
        <input type="text" id="username" placeholder="Nickname" maxlength="60">
        <input type="text" id="room" placeholder="Room Name (e.g. lobby)">
        <button onclick="joinChat()">Start Chatting</button>
        
        <div class="featured-spaces">
            <p>Or join a popular space:</p>
            <div class="space-tags">
                <span class="space-tag" onclick="quickJoin('lobby')">#lobby</span>
                <span class="space-tag" onclick="quickJoin('gaming')">#gaming</span>
                <span class="space-tag" onclick="quickJoin('music')">#music</span>
                <span class="space-tag" onclick="quickJoin('random')">#random</span>
            </div>
        </div>
    </div>

    <header>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button onclick="leaveRoom()" style="padding: 6px 12px; font-size: 13px; width: auto; background: #334155; margin: 0;">&#8592; Back</button>
            <div style="font-weight:bold; font-size:18px;" id="room-display">#Lobby</div>
        </div>
        <div id="status"><div class="dot" id="status-dot"></div> <span id="peer-count">Offline</span></div>
    </header>

    <div id="messages"></div>

    <footer>
        <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
        <button onclick="sendMessage()" style="width: 80px; padding: 0;">Send</button>
    </footer>
</div>

    // --- GATEKEEPER LOGIC ---
    function checkSitePassword() {
        const input = document.getElementById('site-password').value;
        if (input === SITE_ACCESS_PASSWORD) {
            document.getElementById('gatekeeper-screen').style.display = 'none';
        } else {
            alert("Access Denied: Incorrect Password");
            document.getElementById('site-password').value = '';
        }
    }

    document.getElementById('site-password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkSitePassword();
    });

    // --- QUICK JOIN LOGIC ---
    function quickJoin(roomName) {
        document.getElementById('room').value = roomName;
        // If they haven't typed a nickname yet, focus that box. Otherwise, start chat!
        if (!document.getElementById('username').value.trim()) {
            document.getElementById('username').focus();
        } else {
            joinChat();
        }
    }

    // --- CHAT LOGIC ---

    let peer;
    let myId, myName, roomId;
    let connections = {};
    let seenIds = new Set();
    let isHost = false;
   
    const peerConfig = {
        debug: 1,
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
            ]
        }
    };

    function filter(text) {
        return text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function censorMessage(text) {
        let cleanText = text;
        BANNED_WORDS.forEach(word => {
            const regex = new RegExp(`\\b${word}\\b`, 'gi');
            const replacement = '*'.repeat(word.length);
            cleanText = cleanText.replace(regex, replacement);
        });
        return cleanText;
    }

    function joinChat() {
        myName = document.getElementById('username').value.trim();
        let r = document.getElementById('room').value.trim().toLowerCase();
       
        if (!myName || !r) return alert("Nickname and Room are required!");
       
        roomId = "chat-room-" + r.replace(/[^a-z0-9]/g, ''); 
       
        document.getElementById('room-display').innerText = "#" + r;
        document.getElementById('login-screen').style.display = 'none';
        setStatus("Connecting...", "orange");

        initPeer(false); 
    }

    // --- LEAVE ROOM LOGIC ---
    // --- LEAVE ROOM LOGIC ---
    function leaveRoom() {
        // Disconnect from the current peer network
        if (peer) {
            peer.destroy();
            peer = null;
        } // <--- This closing brace was missing!
        
        // Reset state variables
        connections = {};
        seenIds.clear();
        isHost = false;
        
        // Clear chat messages
        document.getElementById('messages').innerHTML = '';
        
        // Show the login screen again and reset header
        document.getElementById('login-screen').style.display = 'flex';
        setStatus("Offline", "");
        document.getElementById('status-dot').className = "dot";
        document.getElementById('room-display').innerText = "#Lobby";
    }
        if (peer) {
            peer.destroy();
            peer = null;
        
        // Reset state variables
        connections = {};
        seenIds.clear();
        isHost = false;
        
        // Clear chat messages
        document.getElementById('messages').innerHTML = '';
        
        // Show the login screen again and reset header
        document.getElementById('login-screen').style.display = 'flex';
        setStatus("Offline", "");
        document.getElementById('status-dot').className = "dot";
        document.getElementById('room-display').innerText = "#Lobby";
    }

    function initPeer(forceHost = false) {
        let id = forceHost ? roomId : null;
       
        if (peer) peer.destroy();
        peer = new Peer(id, peerConfig);

        peer.on('open', (id) => {
            myId = id;
            if (myId === roomId) {
                isHost = true;
                setStatus("Hosting Room", "green");
                addSystemMsg("You are the host.");
            } else {
                connectToHost();
            }
        });

        peer.on('connection', (conn) => {
            handleConnection(conn);
        });

        peer.on('error', (err) => {
            console.log("Peer Error:", err.type);
            if (err.type === 'unavailable-id') {
                isHost = false;
                initPeer(false); 
            } else if (err.type === 'network' || err.type === 'disconnected') {
                setStatus("Connection Lost", "red");
            }
        });
    }

    // Broadcast to all peers
    function broadcast(data) {
        Object.values(connections).forEach(c => {
            if (c.open) c.send(data);
        });
    }

    // Broadcast a system message (host only)
    function broadcastSystem(message) {
        const msgId = Date.now() + Math.random().toString();
        const payload = {
            id: msgId,
            type: 'system',
            text: message
        };
        seenIds.add(msgId);
        broadcast(payload);
        renderSystemMessage(payload);
    }

    function connectToHost() {
        setStatus("Finding Host...", "orange");
        let conn = peer.connect(roomId, { reliable: true });
        let connected = false;

        conn.on('open', () => {
            connected = true;
            setStatus("Connected", "green");
            setupConn(conn);
        });

        setTimeout(() => {
            if (!connected) {
                initPeer(true);
            }
        }, 5000); 
    }

    function handleConnection(conn) {
        setupConn(conn);
    }

    function setupConn(c) {
        connections[c.peer] = c;
        updateCount();

        // Host announces when someone joins
        if (isHost) {
            broadcastSystem("A new user joined the chat.");
        }
       
        c.on('data', (data) => {
            if (seenIds.has(data.id)) return;
            seenIds.add(data.id);

            // System vs normal messages
            if (data.type === 'system') {
                renderSystemMessage(data);
                return;
            }

            if (isHost) broadcast(data);
            renderMessage(data);
        });
       
        c.on('close', () => { 
            delete connections[c.peer]; 
            updateCount(); 
        });
    }

    function sendMessage() {
        const txt = document.getElementById('msg-input').value.trim();
        if (!txt) return;
       
        const msgId = Date.now() + Math.random().toString();
        const censoredText = censorMessage(txt);
        const safeText = filter(censoredText);

        const payload = { id: msgId, name: myName, text: safeText };
       
        seenIds.add(msgId);
        broadcast(payload); 
        renderMessage(payload, true);
        document.getElementById('msg-input').value = '';
    }

    function renderMessage(data, isMe = false) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `msg-row ${isMe ? 'sent' : 'recv'}`;
        div.innerHTML = `
            <div class="sender-name">${isMe ? 'You' : data.name}</div>
            <div class="bubble">${data.text}</div>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function renderSystemMessage(data) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.style.textAlign = "center";
        div.style.fontSize = "12px";
        div.style.color = "#64748b";
        div.style.margin = "10px 0";
        div.textContent = data.text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function addSystemMsg(txt) {
        const box = document.getElementById('messages');
        box.innerHTML += `<div style="text-align:center; font-size:12px; color:#64748b; margin:10px 0;">${txt}</div>`;
    }

    function setStatus(msg, color) {
        document.getElementById('peer-count').innerText = msg;
        const dot = document.getElementById('status-dot');
        dot.className = "dot " + color;
    }

    function updateCount() {
        if (!isHost) return; 
        const c = Object.keys(connections).length;
        document.getElementById('peer-count').innerText = `${c} Peers Connected`;
    }
   
    document.getElementById('msg-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</html>
