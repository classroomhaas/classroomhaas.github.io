<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin P2P Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; color: #f8fafc; overflow: hidden; }
        .container { background: #1e293b; width: 100%; max-width: 400px; height: 650px; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; position: relative; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        
        /* Overlay & Lobby */
        #overlay { position: absolute; inset: 0; background: #1e293b; z-index: 100; display: flex; flex-direction: column; padding: 30px; }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo h2 { color: #38bdf8; font-size: 28px; }
        
        input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #334155; border-radius: 12px; outline: none; background: #0f172a; color: white; transition: border 0.2s; }
        input:focus { border-color: #38bdf8; }
        
        button { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: opacity 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Fake "Discovery" Section */
        .discovery { margin-top: 30px; background: #0f172a; border-radius: 16px; padding: 15px; flex: 1; border: 1px solid #334155; }
        .discovery h4 { font-size: 12px; text-transform: uppercase; color: #64748b; margin-bottom: 10px; letter-spacing: 1px; }
        .room-tag { display: inline-block; background: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 12px; margin: 4px; border: 1px solid #334155; cursor: pointer; }
        .room-tag:hover { border-color: #38bdf8; color: #38bdf8; }

        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #0f172a; }
        .msg { padding: 10px 16px; border-radius: 18px; max-width: 85%; font-size: 14px; line-height: 1.4; }
        .sent { background: #38bdf8; color: #0f172a; align-self: flex-end; border-bottom-right-radius: 4px; }
        .recv { background: #334155; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
        #log { font-size: 10px; color: #64748b; padding: 8px 15px; background: #1e293b; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="overlay">
        <div class="logo">
            <h2>Dolphin</h2>
            <p style="font-size: 12px; color: #64748b;">Private P2P Mesh</p>
        </div>

        <input type="text" id="nick" placeholder="Your Nickname">
        <input type="text" id="room" placeholder="Enter Room ID (e.g. 1234)">
        <button id="go">START CHAT</button>

        <div class="discovery">
            <h4>Common Rooms</h4>
            <div id="quickRooms">
                <span class="room-tag" onclick="setRoom('lobby')">#lobby</span>
                <span class="room-tag" onclick="setRoom('help')">#help</span>
                <span class="room-tag" onclick="setRoom('dev')">#dev</span>
                <span class="room-tag" onclick="setRoom('gaming')">#gaming</span>
            </div>
            <p style="font-size: 10px; color: #475569; margin-top: 15px;">Note: IDs are private. Share your ID with a friend to connect directly.</p>
        </div>
        
        <p id="status" style="font-size: 11px; margin-top: 15px; color: #38bdf8; text-align: center;"></p>
    </div>

    <div id="log">System: Offline</div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="msgInp" placeholder="Type a message...">
        <button id="send" style="width: 80px; margin: 0;">SEND</button>
    </div>
</div>

<script>
    let peer = null, conn = null, myNick = "";
    const logEl = document.getElementById('log');
    const status = document.getElementById('status');

    function updateLog(msg) { logEl.innerText = "System: " + msg; }
    function setRoom(val) { document.getElementById('room').value = val; }

    const iceConfig = {
        config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }, { 'urls': 'stun:stun1.l.google.com:19302' }] }
    };

    document.getElementById('go').onclick = function() {
        myNick = document.getElementById('nick').value.trim() || "Anonymous";
        let roomInput = document.getElementById('room').value.trim().toLowerCase();
        
        if(!roomInput) return alert("Please enter a Room ID");
        
        this.disabled = true;
        updateLog("Initializing Peer...");
        const roomID = "dolph-p2p-" + roomInput;

        // Attempt to "own" this Room ID
        peer = new Peer(roomID, iceConfig);

        peer.on('open', (id) => {
            status.innerText = "Room Created. Waiting for someone to join...";
            updateLog("Listening on: " + roomInput);
        });

        // If someone connects to us (we are the Host)
        peer.on('connection', (incoming) => {
            updateLog("Peer connected!");
            conn = incoming;
            setupConnection();
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                // Room is "taken", so we join as a Guest instead
                updateLog("Room exists. Joining...");
                joinRoom(roomID);
            } else {
                updateLog("Error: " + err.type);
                this.disabled = false;
            }
        });
    };

    function joinRoom(id) {
        if (peer) peer.destroy();
        // Create a peer with a random ID
        peer = new Peer(iceConfig);
        peer.on('open', () => {
            conn = peer.connect(id, { reliable: true });
            setupConnection();
        });
    }

    function setupConnection() {
        conn.on('open', () => {
            updateLog("Secure Channel Established");
            document.getElementById('overlay').style.display = 'none';
            // Announce presence
            conn.send({ n: "System", m: `${myNick} has joined the chat.` });
        });

        conn.on('data', (data) => {
            if(data.n && data.m) addMsg(data.n, data.m, 'recv');
        });

        conn.on('close', () => {
            alert("Peer disconnected.");
            location.reload();
        });
    }

    function addMsg(name, msg, side) {
        const div = document.createElement('div');
        div.className = `msg ${side}`;
        const isSys = name === "System";
        div.style.fontStyle = isSys ? "italic" : "normal";
        div.style.opacity = isSys ? "0.6" : "1";
        
        div.innerHTML = `<small style="display:block;font-weight:bold;font-size:10px;margin-bottom:2px;">${name}</small>${msg}`;
        document.getElementById('chat').appendChild(div);
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    function send() {
        const inp = document.getElementById('msgInp');
        const val = inp.value.trim();
        if(!val || !conn) return;
        
        conn.send({ n: myNick, m: val });
        addMsg("You", val, 'sent');
        inp.value = "";
    }

    document.getElementById('send').onclick = send;
    document.getElementById('msgInp').onkeypress = (e) => { if(e.key === 'Enter') send(); };
</script>
</body>
</html>
