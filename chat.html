<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin P2P Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; color: #f8fafc; }
        .container { background: #1e293b; width: 100%; max-width: 400px; height: 600px; display: flex; flex-direction: column; border-radius: 20px; overflow: hidden; position: relative; border: 1px solid #334155; }
        #overlay { position: absolute; inset: 0; background: #1e293b; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #334155; border-radius: 12px; outline: none; background: #0f172a; color: white; }
        button { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #0f172a; }
        .msg { padding: 10px 16px; border-radius: 18px; max-width: 85%; font-size: 14px; }
        .sent { background: #38bdf8; color: #0f172a; align-self: flex-end; border-bottom-right-radius: 4px; }
        .recv { background: #334155; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
        #log { font-size: 10px; color: #64748b; padding: 10px; background: #1e293b; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

<div class="container">
    <div id="overlay">
        <h2>Dolphin Chat</h2>
        <input type="text" id="nick" placeholder="Nickname">
        <input type="text" id="room" placeholder="Room ID (e.g. 5566)">
        <button id="go">CONNECT</button>
        <p id="status" style="font-size: 12px; margin-top: 20px; color: #64748b;"></p>
    </div>
    <div id="log">System: Ready</div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="msgInp" placeholder="Type a message...">
        <button id="send" style="width: 80px;">SEND</button>
    </div>
</div>

<script>
    let peer = null, conn = null, myNick = "";
    const logEl = document.getElementById('log');
    const status = document.getElementById('status');

    function updateLog(msg) { logEl.innerText = "System: " + msg; }

    const iceConfig = {
        config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }, { 'urls': 'stun:stun1.l.google.com:19302' }] }
    };

    document.getElementById('go').onclick = function() {
        myNick = document.getElementById('nick').value.trim();
        let roomInput = document.getElementById('room').value.trim().toLowerCase();
        
        if(!myNick || !roomInput) return alert("Nickname and Room ID required!");
        
        this.disabled = true;
        updateLog("Connecting to Peer Network...");
        const roomID = "dolph-final-" + roomInput;

        peer = new Peer(roomID, iceConfig);

        peer.on('open', () => {
            status.innerText = "Room ready. Waiting for friend...";
            updateLog("ID Registered: " + roomID);
        });

        peer.on('connection', (incoming) => {
            updateLog("Incoming connection detected...");
            conn = incoming;
            setup();
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                updateLog("Room occupied. Joining as guest...");
                join(roomID);
            } else {
                updateLog("Error: " + err.type);
                this.disabled = false;
            }
        });
    };

    function join(id) {
        if (peer) peer.destroy();
        peer = new Peer(iceConfig);
        peer.on('open', () => {
            updateLog("Guest ID open. Connecting to host...");
            conn = peer.connect(id, { reliable: true });
            setup();
        });
    }

    function setup() {
        conn.on('open', () => {
            updateLog("Handshake complete. Channel open.");
            document.getElementById('overlay').style.display = 'none';
        });
        conn.on('data', (data) => {
            if(data.n && data.m) addMsg(data.n, data.m, 'recv');
        });
    }

    function addMsg(name, msg, side) {
        const div = document.createElement('div');
        div.className = `msg ${side}`;
        div.innerHTML = `<small style="display:block;font-weight:bold;font-size:10px;opacity:0.7;">${name}</small>${msg}`;
        document.getElementById('chat').appendChild(div);
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    function send() {
        const inp = document.getElementById('msgInp');
        if(!inp.value.trim() || !conn) return;
        conn.send({ n: myNick, m: inp.value });
        addMsg("You", inp.value, 'sent');
        inp.value = "";
    }

    document.getElementById('send').onclick = send;
    document.getElementById('msgInp').onkeypress = (e) => { if(e.key === 'Enter') send(); };
</script>
</body>
</html>
