<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat Node</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 500px; height: 100%; max-height: 800px; background: var(--panel); display: flex; flex-direction: column; position: relative; border-left: 1px solid #334155; border-right: 1px solid #334155; }
        /*idk*/
        /* Login Screen */
        #login-screen { position: absolute; inset: 0; background: var(--panel); z-index: 50; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        h1 { color: var(--accent); margin-bottom: 20px; text-align: center; }
        input { background: var(--bg); border: 1px solid #334155; color: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--accent); }
        button { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        
        /* Chat UI */
        header { padding: 15px; border-bottom: 1px solid #334155; background: rgba(15, 23, 42, 0.5); display: flex; justify-content: space-between; align-items: center; }
        #status { font-size: 12px; color: #4ade80; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .msg-row { display: flex; flex-direction: column; max-width: 85%; }
        .msg-row.sent { align-self: flex-end; align-items: flex-end; }
        .msg-row.recv { align-self: flex-start; align-items: flex-start; }
        
        .bubble { padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .sent .bubble { background: var(--accent); color: white; border-bottom-right-radius: 2px; }
        .recv .bubble { background: #334155; color: white; border-bottom-left-radius: 2px; }
        
        .sender-name { font-size: 11px; color: #94a3b8; margin-bottom: 4px; margin-left: 2px; }
        
        footer { padding: 15px; background: var(--panel); border-top: 1px solid #334155; display: flex; gap: 10px; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="login-screen">
        <h1>Global Chat</h1>
        <p style="color:#94a3b8; text-align:center; margin-bottom:20px; font-size:14px;">Enter a Room Name to join your friends.</p>
        <input type="text" id="username" placeholder="Nickname" maxlength="12">
        <input type="text" id="room" placeholder="Room Name (e.g. lobby)">
        <button onclick="joinChat()">Join Room</button>
    </div>

    <header>
        <div style="font-weight:bold; font-size:18px;" id="room-display">#Lobby</div>
        <div id="status"><div class="dot"></div> <span id="peer-count">Connecting...</span></div>
    </header>

    <div id="messages"></div>

    <footer>
        <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
        <button onclick="sendMessage()" style="width: 80px; padding: 0;">Send</button>
    </footer>
</div>

<script>
    let peer, conn;
    let myId, myName, roomId;
    let connections = {};
    let seenIds = new Set();
    const bannedWords = ["badword1", "badword2"]; // Add filters if needed

    function filter(text) {
        // Basic filter placeholder
        return text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function joinChat() {
        myName = document.getElementById('username').value.trim();
        let r = document.getElementById('room').value.trim().toLowerCase();
        
        if (!myName || !r) return alert("Nickname and Room are required!");
        
        roomId = "chat-room-" + r.replace(/[^a-z0-9]/g, ''); // Sanitize room name
        document.getElementById('room-display').innerText = "#" + r;
        document.getElementById('login-screen').style.display = 'none';

        // Initialize PeerJS
        peer = new Peer({ debug: 1 });

        peer.on('open', (id) => {
            myId = id;
            document.getElementById('peer-count').innerText = "Online (Waiting)";
            connectToHost();
        });

        peer.on('connection', handleConnection);
        
        peer.on('error', (err) => {
            console.log(err);
            // If ID is taken, it means someone is hosting. We join them.
             if (err.type === 'unavailable-id') { 
                 // We tried to host but couldn't. 
                 // In this logic, we just join.
             }
        });
    }

    // Logic: Everyone tries to connect to a deterministic "Room Host ID"
    // If it fails, they become the host.
    function connectToHost() {
        // Attempt to connect to the "Room ID"
        // Note: PeerJS doesn't let you claim a specific ID easily without an API key in some clouds,
        // so we use a mesh broadcast strategy here for simplicity without a server.
        
        // Strategy: We just open a random ID.
        // We need the user to share the link.
        
        // Revised Strategy for "No Link Sharing":
        // We will try to connect to the roomId. 
        // If we can't, we destroy our peer and recreate it AS the roomId.
        
        let destId = roomId;
        
        // Try connecting to the room host
        let conn = peer.connect(destId);
        
        conn.on('open', () => {
            document.getElementById('peer-count').innerText = "Connected to Room";
            setupConn(conn);
        });

        conn.on('error', (err) => {
            // Connection failed, maybe room doesn't exist?
            // We become the room.
            becomeHost();
        });
        
        // Fallback: If connection doesn't open in 2 seconds, assume we need to host
        setTimeout(() => {
            if (!conn.open) becomeHost();
        }, 2000);
    }

    function becomeHost() {
        if (peer.id === roomId) return; // Already host
        peer.destroy();
        peer = new Peer(roomId); // Claim the Room ID
        peer.on('open', () => {
             document.getElementById('peer-count').innerText = "Hosting Room";
             addSystemMsg("You are the host. Others can join " + roomId.replace('chat-room-', ''));
        });
        peer.on('connection', handleConnection);
        peer.on('error', err => {
            if (err.type === 'unavailable-id') {
                // If we can't become host, someone else beat us to it.
                // Revert to random ID and connect.
                peer = new Peer();
                peer.on('open', () => {
                    let c = peer.connect(roomId);
                    c.on('open', () => setupConn(c));
                });
            }
        });
    }

    function handleConnection(conn) {
        setupConn(conn);
    }

    function setupConn(c) {
        connections[c.peer] = c;
        updateCount();
        
        c.on('data', (data) => {
            if (seenIds.has(data.id)) return;
            seenIds.add(data.id);
            
            // Relay if I am host
            if (peer.id === roomId) broadcast(data);
            
            renderMessage(data);
        });
        
        c.on('close', () => { delete connections[c.peer]; updateCount(); });
    }

    function broadcast(data) {
        Object.values(connections).forEach(c => {
            if (c.open) c.send(data);
        });
    }

    function sendMessage() {
        const txt = document.getElementById('msg-input').value.trim();
        if (!txt) return;
        
        const msgId = Date.now() + Math.random().toString();
        const payload = { id: msgId, name: myName, text: filter(txt) };
        
        seenIds.add(msgId);
        broadcast(payload); // Send to peers
        renderMessage(payload, true); // Show locally
        
        document.getElementById('msg-input').value = '';
    }

    function renderMessage(data, isMe = false) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `msg-row ${isMe ? 'sent' : 'recv'}`;
        div.innerHTML = `
            <div class="sender-name">${isMe ? 'You' : data.name}</div>
            <div class="bubble">${data.text}</div>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function addSystemMsg(txt) {
        const box = document.getElementById('messages');
        box.innerHTML += `<div style="text-align:center; font-size:12px; color:#64748b; margin:10px 0;">${txt}</div>`;
    }

    function updateCount() {
        const c = Object.keys(connections).length;
        document.getElementById('peer-count').innerText = c > 0 ? `${c} Peers` : "Waiting...";
    }
    
    // Enter key to send
    document.getElementById('msg-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
