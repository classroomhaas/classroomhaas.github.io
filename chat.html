<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zearn Chat</title>
    
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --primary: #4da6ff; /* Neon Blue */
            --glass: rgba(20, 20, 20, 0.7);
            --glass-strong: rgba(10, 10, 10, 0.9);
            --border: 1px solid rgba(77, 166, 255, 0.2);
            --text: #e0e0e0;
            --shadow: 0 0 20px rgba(77, 166, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(77, 166, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(77, 166, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- PARTICLES --- */
        #tsparticles {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; z-index: 0; pointer-events: none;
        }

        /* --- CONTAINER --- */
        .app-container {
            width: 100%; max-width: 600px;
            height: 90vh; max-height: 800px;
            background: var(--glass-strong);
            backdrop-filter: blur(15px);
            border: var(--border);
            border-radius: 16px;
            display: flex; flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            z-index: 10;
            overflow: hidden;
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute; inset: 0;
            background: var(--glass-strong);
            z-index: 50;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 40px;
            transition: opacity 0.3s ease;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(77,166,255,0.4);
        }

        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; text-align: center; }

        input {
            width: 100%; max-width: 300px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #333;
            color: white; padding: 12px 20px;
            margin-bottom: 15px;
            border-radius: 8px; font-size: 16px; outline: none;
            transition: 0.3s;
            text-align: center;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(77,166,255,0.2); }

        button {
            background: rgba(77, 166, 255, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        button:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }

        /* --- FEATURED TAGS --- */
        .space-tags { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
        .space-tag {
            background: rgba(255,255,255,0.05);
            color: #aaa; padding: 8px 16px;
            border-radius: 20px; font-size: 12px; cursor: pointer;
            border: 1px solid transparent; transition: 0.3s;
        }
        .space-tag:hover { border-color: var(--primary); color: white; background: rgba(77,166,255,0.1); }

        /* --- CHAT UI --- */
        header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.4);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .header-left { display: flex; align-items: center; gap: 15px; }
        .back-btn { padding: 6px 12px; font-size: 12px; border-color: #444; color: #aaa; background: transparent; }
        .back-btn:hover { border-color: white; color: white; background: transparent; box-shadow: none; }
        
        #room-display { font-family: 'Poppins', sans-serif; font-weight: 700; color: white; font-size: 1.1rem; }
        
        #status { font-size: 12px; color: #666; display: flex; align-items: center; gap: 8px; font-family: monospace; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .dot.green { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .dot.orange { background: #ffaa00; box-shadow: 0 0 8px #ffaa00; }
        .dot.red { background: #ff0044; box-shadow: 0 0 8px #ff0044; }

        /* --- MESSAGES --- */
        #messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
            scroll-behavior: smooth;
        }
        
        .msg-row { display: flex; flex-direction: column; max-width: 80%; }
        .msg-row.sent { align-self: flex-end; align-items: flex-end; }
        .msg-row.recv { align-self: flex-start; align-items: flex-start; }

        .sender-name { font-size: 10px; color: #666; margin-bottom: 4px; margin-left: 4px; font-family: monospace; }
        .sent .sender-name { margin-right: 4px; }

        .bubble {
            padding: 10px 16px; border-radius: 12px; font-size: 14px;
            line-height: 1.5; word-wrap: break-word;
            position: relative;
        }
        .sent .bubble {
            background: rgba(77, 166, 255, 0.15);
            border: 1px solid rgba(77, 166, 255, 0.3);
            color: white;
            border-bottom-right-radius: 2px;
        }
        .recv .bubble {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ddd;
            border-bottom-left-radius: 2px;
        }

        /* --- FOOTER INPUT --- */
        footer {
            padding: 15px;
            background: rgba(0,0,0,0.6);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; gap: 10px;
        }
        
        #msg-input {
            margin: 0; text-align: left;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #msg-input:focus { border-color: var(--primary); }
        
        .send-btn { width: auto; padding: 0 25px; margin: 0; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    </style>
</head>
<body>

<div id="tsparticles"></div>

<div class="app-container">

    <div id="gatekeeper-screen" class="screen">
        <h1>Private Access</h1>
        <p>Enter the site password to continue.</p>
        <input type="password" id="site-password" placeholder="PASSWORD">
        <button onclick="checkSitePassword()">Unlock</button>
    </div>

    <div id="login-screen" class="screen" style="display:none;">
        <h1>Global Chat</h1>
        <p>Choose a nickname and room</p>
        <input type="text" id="username" placeholder="Nickname" maxlength="20">
        <input type="text" id="room" placeholder="Room Name (e.g. lobby)">
        <button onclick="joinChat()">Start Chatting</button>
        
        <div style="margin-top: 30px;">
            <p style="margin-bottom: 10px; font-size: 0.8rem;">POPULAR ROOMS</p>
            <div class="space-tags">
                <span class="space-tag" onclick="quickJoin('lobby')">#lobby</span>
                <span class="space-tag" onclick="quickJoin('gaming')">#gaming</span>
                <span class="space-tag" onclick="quickJoin('music')">#music</span>
                <span class="space-tag" onclick="quickJoin('dev')">#dev</span>
            </div>
        </div>
    </div>

    <header>
        <div class="header-left">
            <button class="back-btn" onclick="leaveRoom()">&#8592; Exit</button>
            <div id="room-display">#Lobby</div>
        </div>
        <div id="status">
            <div class="dot" id="status-dot"></div>
            <span id="peer-count">Offline</span>
        </div>
    </header>

    <div id="messages"></div>

    <footer>
        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
<script>
    tsParticles.load("tsparticles", {
        fullScreen: { enable: false },
        fpsLimit: 60,
        particles: {
            color: { value: "#4da6ff" },
            links: { color: "#4da6ff", distance: 150, enable: true, opacity: 0.1, width: 1 },
            move: { enable: true, speed: 0.5 },
            number: { density: { enable: true, area: 800 }, value: 40 },
            opacity: { value: 0.3 },
            shape: { type: "circle" },
            size: { value: { min: 1, max: 3 } }
        },
        detectRetina: true
    });
</script>

<script>
    // --- CONFIGURATION ---
    const SITE_ACCESS_PASSWORD = "notlebronjames"; 
    
    // --- BANNED WORDS LIST ---
    const BANNED_WORDS = [
        "badword", "blockme", "test", "swear", "hack",
        "nig", "nazi", "jew", "fag", "neg", "faggot",
        "n1g", "nigger", "naz1", "j3w", "f@g", "retard", "coon", 
        "c00n", "damm", "d4mm", "h3ll", "cunt", "fuc", "shit", 
        "fuck", "ass", "dild", "rape", "dick", "porn", "penis", 
        "kys", "whore", "hoe", "slut", "stfu", "twat", "anal", 
        "boob", "bitch", "gore", "cock", "cum"
    ];

    // --- STATE ---
    let peer;
    let myId, myName, roomId;
    let connections = {};
    let seenIds = new Set();
    let isHost = false;

    // --- CENSORSHIP FUNCTION ---
    function censorMessage(text) {
        let cleanText = text;
        BANNED_WORDS.forEach(word => {
            // Case-insensitive replacement
            const regex = new RegExp(word, 'gi');
            cleanText = cleanText.replace(regex, '*'.repeat(word.length));
        });
        return cleanText;
    }

    // --- GATEKEEPER ---
    function checkSitePassword() {
        const input = document.getElementById('site-password').value;
        if (input === SITE_ACCESS_PASSWORD) {
            document.getElementById('gatekeeper-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('gatekeeper-screen').style.display = 'none';
                document.getElementById('login-screen').style.display = 'flex';
            }, 300);
        } else {
            alert("Incorrect Password");
            document.getElementById('site-password').value = '';
        }
    }

    document.getElementById('site-password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkSitePassword();
    });

    // --- JOIN LOGIC ---
    function quickJoin(roomName) {
        document.getElementById('room').value = roomName;
        if (!document.getElementById('username').value.trim()) {
            document.getElementById('username').focus();
        } else {
            joinChat();
        }
    }

    function joinChat() {
        myName = document.getElementById('username').value.trim();
        let r = document.getElementById('room').value.trim().toLowerCase();
        
        if (!myName || !r) return alert("Nickname and Room are required!");
        
        roomId = "chat-room-" + r.replace(/[^a-z0-9]/g, ''); 
        
        document.getElementById('room-display').innerText = "#" + r;
        
        // Hide Login
        document.getElementById('login-screen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('login-screen').style.display = 'none';
        }, 300);

        setStatus("Connecting...", "orange");
        initPeer(false); 
    }

    function leaveRoom() {
        if (peer) {
            peer.destroy();
            peer = null;
        }
        connections = {};
        seenIds.clear();
        isHost = false;
        document.getElementById('messages').innerHTML = '';
        
        document.getElementById('login-screen').style.display = 'flex';
        setTimeout(() => document.getElementById('login-screen').style.opacity = '1', 10);
        
        setStatus("Offline", "");
        document.getElementById('status-dot').className = "dot";
    }

    // --- PEERJS LOGIC ---
    function initPeer(forceHost = false) {
        let id = forceHost ? roomId : null;
        
        if (peer) peer.destroy();
        
        peer = new Peer(id, {
            debug: 1,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        });

        peer.on('open', (id) => {
            myId = id;
            if (myId === roomId) {
                isHost = true;
                setStatus("Hosting Room", "green");
                addSystemMsg("You created the room.");
            } else {
                connectToHost();
            }
        });

        peer.on('connection', (conn) => {
            handleConnection(conn);
        });

        peer.on('error', (err) => {
            console.log("Peer Error:", err.type);
            if (err.type === 'unavailable-id') {
                isHost = false;
                initPeer(false); 
            } else if (err.type === 'network' || err.type === 'disconnected') {
                setStatus("Connection Lost", "red");
            }
        });
    }

    function connectToHost() {
        setStatus("Finding Host...", "orange");
        let conn = peer.connect(roomId, { reliable: true });
        let connected = false;

        conn.on('open', () => {
            connected = true;
            setStatus("Connected", "green");
            setupConn(conn);
        });

        setTimeout(() => {
            if (!connected) {
                initPeer(true);
            }
        }, 3000); 
    }

    function handleConnection(conn) {
        setupConn(conn);
    }

    function setupConn(c) {
        connections[c.peer] = c;
        updateCount();

        if (isHost) broadcastSystem(`${c.metadata?.name || 'Someone'} joined.`);
        
        c.on('data', (data) => {
            if (seenIds.has(data.id)) return;
            seenIds.add(data.id);

            if (data.type === 'system') {
                renderSystemMessage(data);
                return;
            }

            if (isHost) broadcast(data); 
            renderMessage(data);
        });
        
        c.on('close', () => { 
            delete connections[c.peer]; 
            updateCount(); 
        });
    }

    function broadcast(data) {
        Object.values(connections).forEach(c => {
            if (c.open) c.send(data);
        });
    }

    function broadcastSystem(message) {
        const msgId = Date.now() + Math.random().toString();
        const payload = { id: msgId, type: 'system', text: message };
        seenIds.add(msgId);
        broadcast(payload);
        renderSystemMessage(payload);
    }

    // --- MESSAGING ---
    function sendMessage() {
        const input = document.getElementById('msg-input');
        const txt = input.value.trim();
        if (!txt) return;
        
        const msgId = Date.now() + Math.random().toString();
        
        // 1. CENSOR TEXT (Calling the function now!)
        const censoredText = censorMessage(txt);
        
        // 2. ESCAPE HTML
        const safeText = censoredText.replace(/</g, "&lt;").replace(/>/g, "&gt;"); 

        const payload = { id: msgId, name: myName, text: safeText };
        
        seenIds.add(msgId);
        broadcast(payload); 
        renderMessage(payload, true);
        
        input.value = '';
        input.focus();
    }

    function renderMessage(data, isMe = false) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `msg-row ${isMe ? 'sent' : 'recv'}`;
        div.innerHTML = `
            <div class="sender-name">${isMe ? 'You' : data.name}</div>
            <div class="bubble">${data.text}</div>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function renderSystemMessage(data) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.style.textAlign = "center";
        div.style.fontSize = "11px";
        div.style.color = "#666";
        div.style.margin = "8px 0";
        div.style.fontFamily = "monospace";
        div.textContent = data.text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function addSystemMsg(txt) {
        renderSystemMessage({ text: txt });
    }

    function setStatus(msg, color) {
        document.getElementById('peer-count').innerText = msg;
        const dot = document.getElementById('status-dot');
        dot.className = "dot " + color;
    }

    function updateCount() {
        if (!isHost) return; 
        const c = Object.keys(connections).length;
        document.getElementById('peer-count').innerText = `${c} Peers`;
    }
    
    // --- ENTER KEY FIX (USING KEYDOWN) ---
    document.getElementById('msg-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault(); // Prevents newline if using textarea
            sendMessage();
        }
    });
</script>

</body>
</html>
