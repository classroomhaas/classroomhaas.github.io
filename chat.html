<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat + Filter</title>
   
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 500px; height: 100%; max-height: 800px; background: var(--panel); display: flex; flex-direction: column; position: relative; border-left: 1px solid #334155; border-right: 1px solid #334155; }
        
        /* Login Screen */
        #login-screen { position: absolute; inset: 0; background: var(--panel); z-index: 50; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        h1 { color: var(--accent); margin-bottom: 20px; text-align: center; }
        input { background: var(--bg); border: 1px solid #334155; color: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--accent); }
        button { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        
        /* Chat UI */
        header { padding: 15px; border-bottom: 1px solid #334155; background: rgba(15, 23, 42, 0.5); display: flex; justify-content: space-between; align-items: center; }
        #status { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; background: #64748b; border-radius: 50%; }
        .dot.green { background: #4ade80; }
        .dot.orange { background: #facc15; }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .msg-row { display: flex; flex-direction: column; max-width: 85%; }
        .msg-row.sent { align-self: flex-end; align-items: flex-end; }
        .msg-row.recv { align-self: flex-start; align-items: flex-start; }
        
        .bubble { padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .sent .bubble { background: var(--accent); color: white; border-bottom-right-radius: 2px; }
        .recv .bubble { background: #334155; color: white; border-bottom-left-radius: 2px; }
        
        .sender-name { font-size: 11px; color: #94a3b8; margin-bottom: 4px; margin-left: 2px; }
        
        footer { padding: 15px; background: var(--panel); border-top: 1px solid #334155; display: flex; gap: 10px; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="login-screen">
        <h1>Global Chat</h1>
        <p style="color:#94a3b8; text-align:center; margin-bottom:20px; font-size:14px;">Enter a unique Room Name to join friends.</p>
        <input type="text" id="username" placeholder="Nickname" maxlength="12">
        <input type="text" id="room" placeholder="Room Name (e.g. pizza-party-99)">
        <button onclick="joinChat()">Join Room</button>
    </div>

    <header>
        <div style="font-weight:bold; font-size:18px;" id="room-display">#Lobby</div>
        <div id="status"><div class="dot" id="status-dot"></div> <span id="peer-count">Offline</span></div>
    </header>

    <div id="messages"></div>

    <footer>
        <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
        <button onclick="sendMessage()" style="width: 80px; padding: 0;">Send</button>
    </footer>
</div>

<script>
    // --- CONFIGURATION ---
    
    // 1. EDIT THIS LIST TO ADD YOUR BANNED WORDS
    const BANNED_WORDS = [
        "fuck", 
        "nigger", 
        "faggot", 
        "shit",
        "bullshit",
        "ching chong",
        "ass"
    ];

    let peer;
    let myId, myName, roomId;
    let connections = {};
    let seenIds = new Set();
    let isHost = false;
    
    const peerConfig = {
        debug: 1,
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
            ]
        }
    };

    // Helper: Escapes HTML to prevent injection
    function filter(text) {
        return text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Helper: Censors words from the BANNED_WORDS list
    function censorMessage(text) {
        let cleanText = text;
        
        BANNED_WORDS.forEach(word => {
            // Create a Regular Expression
            // \b ensures we match whole words only (so "class" isn't censored if "ass" is banned)
            // 'gi' means Global search and Case Insensitive
            const regex = new RegExp(`\\b${word}\\b`, 'gi');
            
            // Replace with asterisks of the same length
            const replacement = '*'.repeat(word.length);
            
            cleanText = cleanText.replace(regex, replacement);
        });
        
        return cleanText;
    }

    function joinChat() {
        myName = document.getElementById('username').value.trim();
        let r = document.getElementById('room').value.trim().toLowerCase();
        
        if (!myName || !r) return alert("Nickname and Room are required!");
        
        roomId = "chat-room-" + r.replace(/[^a-z0-9]/g, ''); 
        
        document.getElementById('room-display').innerText = "#" + r;
        document.getElementById('login-screen').style.display = 'none';
        setStatus("Connecting...", "orange");

        initPeer(false); 
    }

    function initPeer(forceHost = false) {
        let id = forceHost ? roomId : null;
        
        if (peer) peer.destroy();
        peer = new Peer(id, peerConfig);

        peer.on('open', (id) => {
            myId = id;
            if (myId === roomId) {
                isHost = true;
                setStatus("Hosting Room", "green");
                addSystemMsg("You are the host. Waiting for others...");
            } else {
                connectToHost();
            }
        });

        peer.on('connection', (conn) => {
            handleConnection(conn);
        });

        peer.on('error', (err) => {
            console.log("Peer Error:", err.type);
            if (err.type === 'unavailable-id') {
                isHost = false;
                initPeer(false); 
            } 
            else if (err.type === 'network' || err.type === 'disconnected') {
                setStatus("Connection Lost", "red");
            }
        });
    }

    function connectToHost() {
        setStatus("Finding Host...", "orange");
        
        let conn = peer.connect(roomId, { reliable: true });

        let connected = false;

        conn.on('open', () => {
            connected = true;
            setStatus("Connected", "green");
            setupConn(conn);
        });

        setTimeout(() => {
            if (!connected) {
                console.log("Host not found. Becoming Host.");
                initPeer(true);
            }
        }, 5000); 
    }

    function handleConnection(conn) {
        setupConn(conn);
    }

    function setupConn(c) {
        connections[c.peer] = c;
        updateCount();
        
        c.on('data', (data) => {
            if (seenIds.has(data.id)) return;
            seenIds.add(data.id);
            
            if (isHost) broadcast(data);
            
            renderMessage(data);
        });
        
        c.on('close', () => { 
            delete connections[c.peer]; 
            updateCount(); 
        });
    }

    function broadcast(data) {
        Object.values(connections).forEach(c => {
            if (c.open) c.send(data);
        });
    }

    function sendMessage() {
        const txt = document.getElementById('msg-input').value.trim();
        if (!txt) return;
        
        const msgId = Date.now() + Math.random().toString();
        
        // 1. Censor the text first
        const censoredText = censorMessage(txt);
        
        // 2. Escape HTML
        const safeText = filter(censoredText);

        const payload = { id: msgId, name: myName, text: safeText };
        
        seenIds.add(msgId);
        
        broadcast(payload); 
        
        renderMessage(payload, true);
        document.getElementById('msg-input').value = '';
    }

    function renderMessage(data, isMe = false) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `msg-row ${isMe ? 'sent' : 'recv'}`;
        div.innerHTML = `
            <div class="sender-name">${isMe ? 'You' : data.name}</div>
            <div class="bubble">${data.text}</div>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function addSystemMsg(txt) {
        const box = document.getElementById('messages');
        box.innerHTML += `<div style="text-align:center; font-size:12px; color:#64748b; margin:10px 0;">${txt}</div>`;
    }

    function setStatus(msg, color) {
        document.getElementById('peer-count').innerText = msg;
        const dot = document.getElementById('status-dot');
        dot.className = "dot " + color;
    }

    function updateCount() {
        if (!isHost) return; 
        const c = Object.keys(connections).length;
        document.getElementById('peer-count').innerText = `${c} Peers Connected`;
    }
    
    document.getElementById('msg-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
