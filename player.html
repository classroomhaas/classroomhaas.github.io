<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Flash Game Player (Ruffle)</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        body {
            margin: 0;
            background: #1c1c1c;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            padding: 10px;
            background: #000000aa;
            font-size: 18px;
            text-align: center;
        }
        #player-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        embed {
            width: 90vw;
            height: 90vh;
        }
    </style>
</head>

<body>

<div id="header">Flash Game Player (Ruffle)</div>

<!-- ⬇️ THIS MUST EXIST OR NOTHING WILL LOAD -->
<div id="player-container">
    <div id="player"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const swf = params.get("file");

    if (!swf) {
        document.getElementById("player").innerHTML = "<p>No SWF loaded.</p>";
    } else {
        document.getElementById("player").innerHTML =
            `<embed src="${swf}" width="100%" height="100%">`;
    }
</script>

</body>
</html>
