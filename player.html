<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ruffle</title>
  <script src="ruffle/ruffle.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: black; /* Optional background */
      overflow: hidden;
    }

    #flash-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #flash-container object {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- Fullscreen container -->
  <div id="flash-container">
    <object type="application/x-shockwave-flash" data="./ruffle/files/breakingthebank.swf"></object>
  </div>

  <script>
    // Ensure Ruffle initializes
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const container = document.getElementById("flash-container");
      const player = ruffle.createPlayer();

      // Replace object with Ruffle player for responsive fullscreen
      const swf = container.querySelector('object');
      const swfUrl = swf.getAttribute('data');
      container.innerHTML = '';
      container.appendChild(player);
      player.style.width = "100%";
      player.style.height = "100%";
      player.load(swfUrl);
    });
  </script>
</body>
</html>
